<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scribbles GameFrame</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SCRIBBLES GAMEFRAME</p>
      <h1>Tic-Tac-Toe Systems Test</h1>
      <p>Authoritative match state, deterministic Theo play, and a browser client using the same contracts intended for Discord Activity delivery.</p>
    </header>

    <section class="panel">
      <div class="status-row">
        <span id="status">Start a match.</span>
        <span id="revision">Revision —</span>
      </div>
      <div id="board" class="board" aria-label="Tic-tac-toe board"></div>
      <div class="actions">
        <button id="new-match" type="button">Challenge Theo</button>
      </div>
      <pre id="details" class="details"></pre>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>

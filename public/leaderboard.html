<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a0d">
  <title>Hall of Fame · Scribbles GameFrame</title>
  <link rel="stylesheet" href="/player-platform.css">
</head>
<body class="gameframe-platform-page">
  <main class="platform-shell hall-shell">
    <header class="platform-heading hall-page-heading">
      <small>GAMEFRAME HALL OF FAME</small>
      <h1>Hall of Fame</h1>
      <p>Gamer Level measures how much you have done across GameFrame. Game standings stay separate, so activity and skill both have somewhere to compete.</p>
    </header>
    <div id="leaderboard-error" class="platform-error" hidden></div>

    <section id="hall-overview" class="hall-overview" aria-label="Hall of Fame leaders">
      <div id="hall-podium" class="hall-podium"><p class="platform-empty">Loading Gamer Level leaders…</p></div>
      <div id="hall-categories" class="hall-category-grid"></div>
    </section>

    <section class="platform-section hall-standings" aria-labelledby="leaderboard-title">
      <header class="platform-section-header leaderboard-header">
        <div>
          <h2 id="leaderboard-title">Standings</h2>
          <span id="leaderboard-rule" class="platform-count">Gamer Level · activity across GameFrame</span>
        </div>
        <label class="leaderboard-filter">Ranking <select id="leaderboard-game" aria-label="Leaderboard ranking"></select></label>
      </header>
      <div id="leaderboard-list" class="leaderboard-list"><p class="platform-empty">Loading standings…</p></div>
    </section>
  </main>
  <script type="module" src="/leaderboard-app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11131b">
  <title>Family Devices · GameFrame</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/family-admin.css">
</head>
<body class="family-admin-route">
  <main class="family-admin-shell">
    <header>
      <p>GAMEFRAME SECURITY</p>
      <h1>Family devices</h1>
      <span>Approve short-lived enrollment requests and revoke persistent trusted devices.</span>
    </header>

    <div id="family-admin-error" class="family-admin-error" role="alert" hidden></div>

    <section class="family-admin-panel" aria-labelledby="pending-title">
      <div class="family-admin-heading">
        <div><small>PENDING</small><h2 id="pending-title">Enrollment requests</h2></div>
        <button id="family-admin-refresh" type="button">Refresh</button>
      </div>
      <div id="family-enrollment-list" class="family-admin-list"><p>Loading…</p></div>
    </section>

    <section class="family-admin-panel" aria-labelledby="devices-title">
      <div class="family-admin-heading"><div><small>TRUSTED</small><h2 id="devices-title">Enrolled devices</h2></div></div>
      <div id="family-device-list" class="family-admin-list"><p>Loading…</p></div>
    </section>
  </main>

  <script type="module" src="/gameframe-pwa.js"></script>
  <script type="module" src="/gameframe-nav.js"></script>
  <script type="module" src="/family-admin.js"></script>
</body>
</html>

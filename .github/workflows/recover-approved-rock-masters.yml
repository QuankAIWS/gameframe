name: Recover Approved Rock Masters
run-name: Recover Approved Rock Masters · PR ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: recover-approved-rock-masters
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.pull_request.number == 124
      && contains(github.event.pull_request.labels.*.name, 'recover-approved-rock-masters')
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out target feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/rpg-encounter-battle-loop
          path: target
          fetch-depth: 1

      - name: Check out authoritative approved rock package
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 40584f32667b6617f21ef49ad2aeb1ab2589775b
          path: approved
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Recover only allowlisted approved masters
        shell: bash
        run: |
          set -euo pipefail
          package_dir='approved/public/assets/monster-master/props/rock-boulder-set-v1/source/package'
          test "$(find "$package_dir" -maxdepth 1 -type f -name 'chunk-*' | wc -l)" -eq 9
          cat "$package_dir"/chunk-* \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/mm-rock-approved-package.bin

          rm -rf /tmp/mm-rock-unpack
          mkdir -p /tmp/mm-rock-unpack
          if tar -tzf /tmp/mm-rock-approved-package.bin >/dev/null 2>&1; then
            tar -xzf /tmp/mm-rock-approved-package.bin -C /tmp/mm-rock-unpack
          elif tar -tf /tmp/mm-rock-approved-package.bin >/dev/null 2>&1; then
            tar -xf /tmp/mm-rock-approved-package.bin -C /tmp/mm-rock-unpack
          else
            gzip -dc /tmp/mm-rock-approved-package.bin > /tmp/mm-rock-approved-package.tar || true
            test -s /tmp/mm-rock-approved-package.tar
            tar --ignore-zeros -xf /tmp/mm-rock-approved-package.tar -C /tmp/mm-rock-unpack || true
          fi

          master_dir='target/public/assets/monster-master/props/rock-boulder-set-v1/source/master'
          mkdir -p "$master_dir"

          declare -A destination=(
            [6e50fe930bfc7b8d1bd93bf5ae859386c5156f851c93f6e08aba12649017bd32]="$master_dir/small-rock-v1-master.png"
            [9654237ba8aa56949e50c9e29959e616d4dfb2ea7747c7623058e14caa095001]="$master_dir/medium-boulder-v1-master.png"
            [5eb658e2d822edfc8e0941227cd317ccbe445f195e01fa6c1864d56824f0557a]="$master_dir/rubble-pile-v1-master.png"
          )

          while IFS= read -r -d '' candidate; do
            digest="$(sha256sum "$candidate" | cut -d' ' -f1)"
            if [[ -n "${destination[$digest]+approved}" ]]; then
              cp "$candidate" "${destination[$digest]}"
              unset 'destination[$digest]'
            fi
          done < <(find /tmp/mm-rock-unpack -type f -iname '*.png' -print0)

          if (( ${#destination[@]} != 0 )); then
            printf 'Missing approved master hashes:\n' >&2
            printf '%s\n' "${!destination[@]}" >&2
            exit 1
          fi

          rm -rf target/public/assets/monster-master/props/rock-boulder-set-v1/source/package

          node <<'NODE'
          const fs = require('node:fs');
          const path = 'target/public/assets/monster-master/props/rock-boulder-set-v1/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.pipeline.masterPolicy = 'Approved 1024x1024 PNG master bytes are committed directly at each member source.materializedPath. Builds and verification require exact file SHA-256 and decoded RGBA pixel hashes before producing derivatives.';
          delete manifest.sourcePackage;
          manifest.sourceRetention = {
            format: 'materialized-git-files',
            policy: 'Each approved master is retained directly in Git and verified against the allowlisted file and decoded-pixel SHA-256 values recorded on its member.'
          };
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Verify exact files, pixels, dimensions, and runtime derivatives
        working-directory: target
        run: |
          npm ci --no-audit --no-fund
          node scripts/monster-master-rock-props.mjs verify

      - name: Commit recovered approved masters to feature branch
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/monster-master-rock-props.mjs \
            public/assets/monster-master/props/rock-boulder-set-v1/manifest.json \
            public/assets/monster-master/props/rock-boulder-set-v1/source
          git diff --cached --check
          git commit -m 'Restore approved Monster Master rock masters'
          git push origin HEAD:agent/rpg-encounter-battle-loop

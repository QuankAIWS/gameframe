name: Monster Master Rock Assets Finalize Trusted

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-rock-assets-finalize-trusted.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out rock asset branch
        uses: actions/checkout@v4
        with:
          ref: agent/monster-master-rock-props-v1
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Finalize or record transfer failure
        shell: bash
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

          set +e
          http_code="$(curl -L --retry 3 --silent --show-error \
            --write-out '%{http_code}' \
            --output /tmp/mm-rock-overlay-final.tar.gz \
            'https://drive.usercontent.google.com/download?id=19XJxw2wfNGn-aa7pOZD7cAC7GNA_E_6Z&export=download&confirm=t')"
          curl_status="$?"
          set -e

          actual_sha="missing"
          actual_size="0"
          if [ -f /tmp/mm-rock-overlay-final.tar.gz ]; then
            actual_sha="$(sha256sum /tmp/mm-rock-overlay-final.tar.gz | cut -d' ' -f1)"
            actual_size="$(wc -c < /tmp/mm-rock-overlay-final.tar.gz)"
          fi

          if [ "$curl_status" = "0" ] && \
             [ "$actual_sha" = "09ea02bc1fc70f1d790e2742ef5f577b0986ca003b66fb5315545ce226be1b8b" ]; then
            tar -xzf /tmp/mm-rock-overlay-final.tar.gz -C .
            npm ci
            npm run assets:props:build
            npm run assets:props:verify
            npm run check:browser
            rm -rf staging/mm-rock-props
            rm -f .github/workflows/probe-mm-rock-transfer.yml
            rm -f .github/workflows/monster-master-rock-assets-finalize-trusted.yml
            git add -A
            git commit -m "feat: add Monster Master rock prop assets"
            git push origin HEAD:agent/monster-master-rock-props-v1
            exit 0
          fi

          mkdir -p staging/mm-rock-props
          {
            echo "curl_status=$curl_status"
            echo "http_code=$http_code"
            echo "size=$actual_size"
            echo "sha256=$actual_sha"
            if [ -f /tmp/mm-rock-overlay-final.tar.gz ]; then
              echo -n "prefix_hex="
              head -c 96 /tmp/mm-rock-overlay-final.tar.gz | od -An -tx1 | tr -d ' \n'
              echo
            fi
          } > staging/mm-rock-props/drive-transfer-status.txt
          rm -f .github/workflows/probe-mm-rock-transfer.yml
          rm -f .github/workflows/monster-master-rock-assets-finalize-trusted.yml
          git add -A
          git commit -m "chore: record rock asset transfer status"
          git push origin HEAD:agent/monster-master-rock-props-v1
          exit 1

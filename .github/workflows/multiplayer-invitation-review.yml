name: Multiplayer Invitation Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/multiplayer-invitation-review.yml"
      - "public/secure-match-invite.js"
      - "public/invite-app.js"
      - "src/auth/match-invitation.ts"
      - "src/cloudflare/invitation-*.ts"
      - "src/cloudflare/worker-router.ts"
      - "test/browser/authenticated-invitation.spec.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: multiplayer-invitation-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  invitation-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Invitation browser syntax
        run: |
          node --check public/secure-match-invite.js
          node --check public/invite-app.js

      - name: Invitation authority contracts
        run: >-
          node --experimental-strip-types --test
          src/auth/match-invitation.test.ts
          src/cloudflare/invitation-object-runtime.test.ts
          src/cloudflare/invitation-router.test.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated invitation browser journey
        run: npx playwright test test/browser/authenticated-invitation.spec.mjs --config playwright.config.mjs

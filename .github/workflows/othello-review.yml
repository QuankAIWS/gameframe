name: Othello Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/othello-review.yml"
      - "public/othello*.html"
      - "public/othello*.css"
      - "public/othello*.js"
      - "src/games/othello/**"
      - "src/server/othello-match-service.ts"
      - "test/browser/othello*.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: othello-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  othello:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Othello browser syntax
        run: |
          node --check public/othello-fidelity-app-1.js
          node --check public/othello-fidelity-app-2.js
          node --check public/othello-fidelity-app-3.js
          node --check public/othello-fidelity-app-4.js
          node --check public/othello-game-menu.js
          node --check public/othello-launcher.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Othello browser journeys
        run: >-
          npx playwright test
          test/browser/othello.spec.mjs
          test/browser/othello-gameplay.spec.mjs
          test/browser/othello-rematch.spec.mjs
          --config playwright.config.mjs

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: othello-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

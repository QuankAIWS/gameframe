name: Othello Rematch Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/othello-review.yml"
      - "public/othello-game-menu.js"
      - "test/browser/othello-rematch.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: othello-rematch-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Othello rematch syntax
        run: node --check public/othello-game-menu.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Othello rematch browser journey
        run: npx playwright test test/browser/othello-rematch.spec.mjs --config playwright.config.mjs

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: othello-rematch-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

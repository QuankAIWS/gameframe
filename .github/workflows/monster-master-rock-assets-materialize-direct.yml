name: Materialize Monster Master rock masters

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-rock-assets-materialize-direct.yml
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: monster-master-rock-assets-materialize-direct
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 107 &&
       github.event.comment.body == '/materialize-mm-rock-direct')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/materialize-mm-rock-direct-assets
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark materializer execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$TARGET_BRANCH"
          git commit --allow-empty -m 'chore: start direct rock materialization'
          git push --force origin "HEAD:${TARGET_BRANCH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Recover approved PNG masters by content hash
        shell: bash
        run: |
          set -euo pipefail
          package_dir='public/assets/monster-master/props/rock-boulder-set-v1/source/package'
          test "$(find "$package_dir" -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')" = '9'

          LC_ALL=C cat "$package_dir"/chunk-* \
            | tr -d '\r\n' \
            | base64 --decode \
            > /tmp/mm-rock-source-package.tar.gz

          set +e
          gzip -dc /tmp/mm-rock-source-package.tar.gz > /tmp/mm-rock-source-package.tar
          gzip_status=$?
          set -e
          echo "gzip recovery status: $gzip_status"
          test -s /tmp/mm-rock-source-package.tar

          rm -rf /tmp/mm-rock-source-recovered
          mkdir -p /tmp/mm-rock-source-recovered
          set +e
          tar -xf /tmp/mm-rock-source-package.tar \
            --ignore-zeros \
            -C /tmp/mm-rock-source-recovered
          tar_status=$?
          set -e
          echo "tar recovery status: $tar_status"

          recover_master() {
            local expected_hash="$1"
            local destination="$2"
            local match=''
            local candidate
            while IFS= read -r -d '' candidate; do
              if [ "$(sha256sum "$candidate" | cut -d' ' -f1)" = "$expected_hash" ]; then
                test -z "$match"
                match="$candidate"
              fi
            done < <(find /tmp/mm-rock-source-recovered -type f -print0)
            test -n "$match"
            install -D -m 0644 "$match" "$destination"
          }

          recover_master \
            '9654237ba8aa56949e50c9e29959e616d4dfb2ea7747c7623058e14caa095001' \
            'public/assets/monster-master/props/rock-boulder-set-v1/source/master/medium-boulder-v1-master.png'
          recover_master \
            '5eb658e2d822edfc8e0941227cd317ccbe445f195e01fa6c1864d56824f0557a' \
            'public/assets/monster-master/props/rock-boulder-set-v1/source/master/rubble-pile-v1-master.png'
          recover_master \
            '6e50fe930bfc7b8d1bd93bf5ae859386c5156f851c93f6e08aba12649017bd32' \
            'public/assets/monster-master/props/rock-boulder-set-v1/source/master/small-rock-v1-master.png'

      - name: Switch pipeline to direct retained masters
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/403a4cce326656fadf8a66cd831d431dcc8514f8" \
            --jq .content | tr -d '\n' | base64 --decode \
            > scripts/monster-master-rock-props.mjs
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/c5a24752fd44922f55827f436cc2c5140efb0de1" \
            --jq .content | tr -d '\n' | base64 --decode \
            > public/assets/monster-master/props/rock-boulder-set-v1/manifest.json

          npm run assets:props:build
          npm run assets:props:verify
          npm run check:browser

      - name: Verify final retained masters and runtime set
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mm-rock-master-hashes <<'EOF'
          9654237ba8aa56949e50c9e29959e616d4dfb2ea7747c7623058e14caa095001  public/assets/monster-master/props/rock-boulder-set-v1/source/master/medium-boulder-v1-master.png
          5eb658e2d822edfc8e0941227cd317ccbe445f195e01fa6c1864d56824f0557a  public/assets/monster-master/props/rock-boulder-set-v1/source/master/rubble-pile-v1-master.png
          6e50fe930bfc7b8d1bd93bf5ae859386c5156f851c93f6e08aba12649017bd32  public/assets/monster-master/props/rock-boulder-set-v1/source/master/small-rock-v1-master.png
          EOF
          sed -i 's/^          //' /tmp/mm-rock-master-hashes
          sha256sum --check --strict /tmp/mm-rock-master-hashes

          for stem in medium-boulder-v1 rubble-pile-v1 small-rock-v1; do
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-512.png"
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-256.webp"
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-128.webp"
          done

      - name: Publish direct-master repair branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/monster-master/props/rock-boulder-set-v1/source/package

          git add -A \
            public/assets/monster-master/props/rock-boulder-set-v1 \
            scripts/monster-master-rock-props.mjs

          test ! -d public/assets/monster-master/props/rock-boulder-set-v1/source/package
          git diff --cached --stat
          git commit -m 'fix: materialize Monster Master rock masters directly'
          git push origin "HEAD:${TARGET_BRANCH}"

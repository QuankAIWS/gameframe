name: Materialize Monster Master rock masters

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-rock-assets-materialize-direct.yml
  issue_comment:
    types:
      - created
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: monster-master-rock-assets-materialize-direct
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 107 &&
       github.event.comment.body == '/materialize-mm-rock-direct')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: agent/materialize-mm-rock-direct-assets
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark materializer execution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$TARGET_BRANCH"
          git commit --allow-empty -m 'chore: start direct rock materialization'
          git push --force origin "HEAD:${TARGET_BRANCH}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Scan recovered stream for approved PNG masters
        shell: bash
        run: |
          set -euo pipefail
          package_dir='public/assets/monster-master/props/rock-boulder-set-v1/source/package'
          test "$(find "$package_dir" -maxdepth 1 -type f -name 'chunk-*' | wc -l | tr -d ' ')" = '9'

          LC_ALL=C cat "$package_dir"/chunk-* \
            | tr -d '\r\n' \
            | base64 --decode \
            > /tmp/mm-rock-source-package.tar.gz

          set +e
          gzip -dc /tmp/mm-rock-source-package.tar.gz > /tmp/mm-rock-source-package.tar
          gzip_status=$?
          set -e
          test -s /tmp/mm-rock-source-package.tar

          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          data = Path('/tmp/mm-rock-source-package.tar').read_bytes()
          signature = b'\x89PNG\r\n\x1a\n'
          expected = {
              '9654237ba8aa56949e50c9e29959e616d4dfb2ea7747c7623058e14caa095001': Path('public/assets/monster-master/props/rock-boulder-set-v1/source/master/medium-boulder-v1-master.png'),
              '5eb658e2d822edfc8e0941227cd317ccbe445f195e01fa6c1864d56824f0557a': Path('public/assets/monster-master/props/rock-boulder-set-v1/source/master/rubble-pile-v1-master.png'),
              '6e50fe930bfc7b8d1bd93bf5ae859386c5156f851c93f6e08aba12649017bd32': Path('public/assets/monster-master/props/rock-boulder-set-v1/source/master/small-rock-v1-master.png'),
          }
          found = {}
          complete_candidates = 0
          offsets = []
          position = 0
          while True:
              start = data.find(signature, position)
              if start < 0:
                  break
              offsets.append(start)
              cursor = start + len(signature)
              end = None
              while cursor + 12 <= len(data):
                  length = int.from_bytes(data[cursor:cursor + 4], 'big')
                  chunk_type = data[cursor + 4:cursor + 8]
                  next_cursor = cursor + 12 + length
                  if next_cursor > len(data):
                      break
                  cursor = next_cursor
                  if chunk_type == b'IEND':
                      end = cursor
                      break
              if end is not None:
                  complete_candidates += 1
                  candidate = data[start:end]
                  digest = hashlib.sha256(candidate).hexdigest()
                  if digest in expected:
                      destination = expected[digest]
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      destination.write_bytes(candidate)
                      found[digest] = str(destination)
              position = start + 1

          diagnostics = {
              'compressedBytes': Path('/tmp/mm-rock-source-package.tar.gz').stat().st_size,
              'recoveredBytes': len(data),
              'pngSignatures': len(offsets),
              'completePngCandidates': complete_candidates,
              'signatureOffsets': offsets,
              'matchedHashes': sorted(found),
              'expectedHashes': sorted(expected),
          }
          Path('.mm-rock-materializer-diagnostics.json').write_text(json.dumps(diagnostics, indent=2) + '\n')
          print(json.dumps(diagnostics, indent=2))
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          diagnostics = json.loads(Path('.mm-rock-materializer-diagnostics.json').read_text())
          assert diagnostics['matchedHashes'] == diagnostics['expectedHashes'], diagnostics
          PY

          echo "gzip recovery status: $gzip_status"
          git add .mm-rock-materializer-diagnostics.json
          git commit -m 'chore: recovered approved rock masters'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Switch pipeline to direct retained masters
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/403a4cce326656fadf8a66cd831d431dcc8514f8" \
            --jq .content | tr -d '\n' | base64 --decode \
            > scripts/monster-master-rock-props.mjs
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/c5a24752fd44922f55827f436cc2c5140efb0de1" \
            --jq .content | tr -d '\n' | base64 --decode \
            > public/assets/monster-master/props/rock-boulder-set-v1/manifest.json

          npm run assets:props:build
          npm run assets:props:verify
          npm run check:browser

          git commit --allow-empty -m 'chore: verified direct rock asset build'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Verify final retained masters and runtime set
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/mm-rock-master-hashes <<'EOF'
          9654237ba8aa56949e50c9e29959e616d4dfb2ea7747c7623058e14caa095001  public/assets/monster-master/props/rock-boulder-set-v1/source/master/medium-boulder-v1-master.png
          5eb658e2d822edfc8e0941227cd317ccbe445f195e01fa6c1864d56824f0557a  public/assets/monster-master/props/rock-boulder-set-v1/source/master/rubble-pile-v1-master.png
          6e50fe930bfc7b8d1bd93bf5ae859386c5156f851c93f6e08aba12649017bd32  public/assets/monster-master/props/rock-boulder-set-v1/source/master/small-rock-v1-master.png
          EOF
          sed -i 's/^          //' /tmp/mm-rock-master-hashes
          sha256sum --check --strict /tmp/mm-rock-master-hashes

          for stem in medium-boulder-v1 rubble-pile-v1 small-rock-v1; do
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-512.png"
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-256.webp"
            test -f "public/assets/monster-master/props/rock-boulder-set-v1/runtime/${stem}-128.webp"
          done

      - name: Publish direct-master repair branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf public/assets/monster-master/props/rock-boulder-set-v1/source/package
          rm -f .mm-rock-materializer-diagnostics.json

          git add -A \
            .mm-rock-materializer-diagnostics.json \
            public/assets/monster-master/props/rock-boulder-set-v1 \
            scripts/monster-master-rock-props.mjs

          test ! -d public/assets/monster-master/props/rock-boulder-set-v1/source/package
          git diff --cached --stat
          git commit -m 'fix: materialize Monster Master rock masters directly'
          git push origin "HEAD:${TARGET_BRANCH}"

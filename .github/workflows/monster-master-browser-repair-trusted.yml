name: Monster Master Browser Repair Trusted

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-browser-repair-trusted.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/monster-master-current-browser-repairs
          fetch-depth: 0

      - name: Reconcile current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Stabilize command options and shell containment
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(before)) throw new Error(`Expected source missing from ${path}`);
            writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            "public/monster-master-app.js",
            "let lastActiveUnitId = null;\nlet viewport = {",
            "let lastActiveUnitId = null;\nlet optionsRenderSignature = null;\nlet viewport = {",
          );

          replaceOnce(
            "public/monster-master-app.js",
            `function renderOptions() {\n  options.replaceChildren();`,
            `function renderOptions() {\n  const signature = [\n    current?.matchId ?? \"\",\n    current?.revision ?? \"\",\n    requestPending ? \"busy\" : \"ready\",\n    activePlayerId() ?? \"\",\n    actionMode ?? \"\",\n    selectedUnitId ?? \"\",\n  ].join(\":\");\n  if (optionsRenderSignature === signature) return;\n  optionsRenderSignature = signature;\n  options.replaceChildren();`,
          );

          replaceOnce(
            "public/monster-master-shell.css",
            `  height: 100%;\n  min-height: 0;\n  padding: 0;`,
            `  height: auto;\n  min-height: 0;\n  align-self: stretch;\n  padding: 0;`,
          );

          replaceOnce(
            "public/monster-master-shell.css",
            `  min-height: 0;\n  gap: var(--monster-shell-gap);\n  padding: var(--monster-shell-gap);`,
            `  height: 100%;\n  min-height: 0;\n  gap: var(--monster-shell-gap);\n  padding: var(--monster-shell-gap);\n  overflow: hidden;`,
          );

          replaceOnce(
            "public/monster-master-shell.css",
            `.monster-master-battlefield-stage {\n  grid-column: 2;`,
            `.monster-master-battlefield-stage {\n  position: relative;\n  z-index: 0;\n  overflow: hidden;\n  grid-column: 2;`,
          );

          replaceOnce(
            "public/monster-master-shell.css",
            `.monster-master-command-deck {\n  grid-column: 2 / 4;`,
            `.monster-master-command-deck {\n  position: relative;\n  z-index: 10;\n  isolation: isolate;\n  grid-column: 2 / 4;`,
          );
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded required validation
        id: validation
        continue-on-error: true
        run: npm run validate

      - name: Commit repaired current-product journeys
        if: steps.validation.outcome == 'success'
        run: |
          rm -f .github/workflows/monster-master-browser-repair-trusted.yml
          git add -A
          git commit -m "fix: repair current Monster Master browser journeys"
          git push origin HEAD:agent/monster-master-current-browser-repairs

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            gh pr comment 68 --body "Current Monster Master repair passed bounded required validation and committed the repaired branch. Trusted run: ${{ github.run_id }}."
          else
            gh pr comment 68 --body "Current Monster Master repair failed bounded required validation. Trusted run: ${{ github.run_id }}."
          fi

      - name: Fail unsuccessful validation
        if: steps.validation.outcome != 'success'
        run: exit 1

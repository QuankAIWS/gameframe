name: Apply Monster Master grass ground v1

on:
  push:
    branches:
      - agent/rpg-rendering-contract-terrain-geometry
    paths:
      - ".github/asset-payload/grass-ground-v1-128.base64"
      - ".github/workflows/agent-apply-grass-ground-v1.yml"

permissions:
  contents: write

concurrency:
  group: apply-monster-master-grass-ground-v1
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out prepared branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpg-rendering-contract-terrain-geometry
          fetch-depth: 0

      - name: Materialize and integrate grass asset
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="public/assets/monster-master/terrain/grass-ground"
          mkdir -p "$asset_dir" planning/monster-master/assets
          base64 --decode .github/asset-payload/grass-ground-v1-128.base64 > "$asset_dir/grass-ground-v1-128.webp"
          cat > "$asset_dir/manifest.json" <<'JSON'
          {
            "schemaVersion": 1,
            "assetId": "monster-master.grass-ground.v1",
            "family": "environment.ground",
            "role": "continuous-base-ground",
            "status": "accepted-pilot",
            "runtime": {
              "path": "/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp",
              "format": "webp",
              "width": 128,
              "height": 128,
              "repeat": true,
              "colorSpace": "srgb"
            },
            "source": {
              "generationId": "1b022daf-cc0e-4996-b2ef-1cc87770b0c3",
              "originalDimensions": [1254, 1254],
              "preparedMasterDimensions": [2048, 2048],
              "preparedMasterSha256": "be36d4d8f882e2f09d76330d6ae00d8bd86be63ae328e5abd5f67f9bcd7b6520",
              "runtimeSha256": "f3dc17c2bfb52a8d71eaef937fbdd54bf313abf0b2bf2035931047843954d551"
            },
            "rendering": {
              "renderer": "pixi",
              "presentation": "top-down material transformed by the engine into the pseudo-isometric ground plane",
              "tileScale": 1.35,
              "ownsGeometry": false
            }
          }
          JSON
          cat > planning/monster-master/assets/grass-ground-v1.md <<'MD'
          # Monster Master Grass Ground v1

          ## Decision

          This is the first accepted bespoke terrain asset produced under the RPG Rendering and Asset Contract. It is the visual material for the continuous Pixi ground plane; it does not define tile geometry, picking, elevation, or gameplay state.

          ## Runtime asset

          - Path: `public/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp`
          - Manifest: `public/assets/monster-master/terrain/grass-ground/manifest.json`
          - Runtime dimensions: 128 × 128
          - Rendering: repeated through a Pixi `TilingSprite`, then transformed by engine-owned geometry into the 2:1 pseudo-isometric battlefield plane

          The source art is straight top-down by design. The renderer, not the source image, applies the pseudo-isometric transform. This keeps the material reusable across camera rotations and prevents baked perspective from disagreeing with the authoritative 72 × 36 cell geometry.

          ## Art intent

          - recognizable grass at battlefield zoom;
          - restrained contrast beneath creatures, highlights, paths, and interface overlays;
          - painted late-1990s / early-2000s PC-game character;
          - no landmarks, grid lines, props, or baked terrain depth;
          - repeatable over a large continuous surface.

          ## Provenance

          - Generation ID: `1b022daf-cc0e-4996-b2ef-1cc87770b0c3`
          - Original generation: 1254 × 1254 PNG
          - Prepared source master: 2048 × 2048 PNG
          - Prepared source-master SHA-256: `be36d4d8f882e2f09d76330d6ae00d8bd86be63ae328e5abd5f67f9bcd7b6520`

          The committed runtime derivative is the durable game asset. Additional larger derivatives may be added only when renderer evidence shows they improve the actual viewport.
          MD
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/browser/monster-master-pixi-entry.js")
          source = path.read_text()
          source = source.replace(
              '  Texture,\n} from "pixi.js";',
              '  Texture,\n  TilingSprite,\n} from "pixi.js";',
              1,
          )
          source = source.replace(
              'const CREATURE_ATLAS = "/assets/monster-master/creature-atlas-v1.svg";\n',
              'const CREATURE_ATLAS = "/assets/monster-master/creature-atlas-v1.svg";\nconst GRASS_GROUND_TEXTURE = "/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp";\n',
              1,
          )
          source = source.replace(
              '''async function loadTextures() {
            const creatureBase = await Assets.load(CREATURE_ATLAS);
            state.textures = { creatureBase };
          }''',
              '''async function loadTextures() {
            const [creatureBase, grassGround] = await Promise.all([
              Assets.load(CREATURE_ATLAS),
              Assets.load(GRASS_GROUND_TEXTURE),
            ]);
            state.textures = { creatureBase, grassGround };
          }''',
              1,
          )
          source = source.replace('  const ground = new Graphics();', '  const ground = new Container();', 1)
          pattern = re.compile(r'function drawGroundPlane\(sourceMap\) \{.*?\n\}\n\nfunction drawTerrainTop', re.S)
          replacement = '''function drawGroundPlane(sourceMap) {
            const ground = state.layers.ground;
            for (const child of ground.removeChildren()) child.destroy({ children: true });
            const apron = mapSurfacePolygon(sourceMap, state.camera.quarter, GROUND_APRON_CELLS);
            const playable = mapSurfacePolygon(sourceMap, state.camera.quarter, 0);
            const backdrop = new Graphics();
            backdrop.poly(flatten(apron))
              .fill({ color: 0x26382f, alpha: 1 })
              .stroke({ color: 0x61735c, alpha: 0.38, width: 2 });
            backdrop.poly(flatten(playable)).fill({ color: 0x4c633d, alpha: 1 });
            ground.addChild(backdrop);

            const xs = playable.map((point) => point.x);
            const ys = playable.map((point) => point.y);
            const width = Math.max(...xs) - Math.min(...xs);
            const height = Math.max(...ys) - Math.min(...ys);
            const materialLayer = new Container();
            materialLayer.position.set(
              (Math.min(...xs) + Math.max(...xs)) / 2,
              (Math.min(...ys) + Math.max(...ys)) / 2,
            );
            materialLayer.scale.y = height / width;
            const side = width / Math.SQRT2;
            const material = new TilingSprite({
              texture: state.textures.grassGround,
              width: side,
              height: side,
            });
            material.anchor.set(0.5);
            material.rotation = Math.PI / 4;
            material.tileScale.set(1.35);
            material.tilePosition.set(state.camera.quarter * 19, state.camera.quarter * -13);
            material.eventMode = "none";
            materialLayer.addChild(material);
            ground.addChild(materialLayer);

            const finish = new Graphics();
            finish.poly(flatten(playable))
              .fill({ color: 0x30482f, alpha: 0.08 })
              .stroke({ color: 0xb0b17f, alpha: 0.2, width: 1.5 });
            ground.addChild(finish);
          }

          function drawTerrainTop'''
          source, count = pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit("Could not replace drawGroundPlane")
          path.write_text(source)
          PY
          cat > src/browser/monster-master-ground-asset-contract.test.mjs <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync, statSync } from "node:fs";
          import test from "node:test";

          const source = readFileSync("src/browser/monster-master-pixi-entry.js", "utf8");
          const manifest = JSON.parse(readFileSync("public/assets/monster-master/terrain/grass-ground/manifest.json", "utf8"));
          const asset = "public/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp";

          test("Monster Master loads the durable grass material through the continuous Pixi ground plane", () => {
            assert.equal(manifest.assetId, "monster-master.grass-ground.v1");
            assert.equal(manifest.runtime.path, "/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp");
            assert.equal(manifest.runtime.repeat, true);
            assert.ok(statSync(asset).size > 4_000);
            assert.match(source, /const GRASS_GROUND_TEXTURE =/);
            assert.match(source, /new TilingSprite/);
            assert.match(source, /const ground = new Container\(\)/);
            assert.doesNotMatch(source, /const ground = new Graphics\(\)/);
          });
          JS

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build committed Pixi bundle
        run: npm run build:monster-master-pixi

      - name: Verify asset and terrain contracts
        run: node --test src/browser/monster-master-ground-asset-contract.test.mjs src/browser/monster-master-terrain-geometry.test.mjs

      - name: Verify browser syntax and renderer architecture
        run: |
          npm run check:browser
          node --experimental-strip-types --test src/browser/monster-master-art-contract.test.ts
          npm run check:monster-master-pixi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Monster Master browser journeys
        run: npx playwright test test/browser/monster-master.spec.mjs test/browser/monster-master-controls.spec.mjs test/browser/motion-polish.spec.mjs --grep "Monster Master" --config playwright.config.mjs

      - name: Capture terrain screenshots
        run: npx playwright test test/visual/monster-master-pixi.spec.mjs test/visual/monster-master-results-and-depth.spec.mjs test/visual/player-ui-regressions.spec.mjs --grep "Monster Master" --config playwright.visual.config.mjs

      - name: Upload terrain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-master-grass-ground-v1-${{ github.run_id }}
          path: |
            visual-results/**/*.png
            visual-results/**/*.zip
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 10

      - name: Commit durable game asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/monster-master/terrain/grass-ground \
            planning/monster-master/assets/grass-ground-v1.md \
            src/browser/monster-master-pixi-entry.js \
            src/browser/monster-master-ground-asset-contract.test.mjs \
            public/monster-master-pixi-bundle.js
          git diff --cached --check
          git commit -m "Integrate Monster Master grass ground asset"
          git push origin HEAD:agent/rpg-rendering-contract-terrain-geometry

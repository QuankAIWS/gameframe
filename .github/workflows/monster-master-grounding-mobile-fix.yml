name: Monster Master Grounding Review Fix

on:
  push:
    branches:
      - fix/monster-master-arena-grounding
    paths:
      - .github/workflows/monster-master-grounding-mobile-fix.yml

permissions:
  contents: write

jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monster-master-arena-grounding
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Apply staged corrections
        run: python scripts/monster-master-grounding-review-fix.py
      - name: Keep malformed library assets out of this product diff
        run: |
          git checkout origin/main -- \
            public/assets/monster-master/creatures/voidshard-reaver-v1-128.webp \
            public/assets/monster-master/creatures/mossmaw-colossus-v1-128.webp
      - name: Focused static proof
        run: |
          node --check public/monster-master-trainer-asset.js
          node --test src/browser/monster-master-trainer-asset.test.mjs src/browser/monster-master-pixi-illustrated-assets.test.mjs
          npm run check:monster-master-pixi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove mobile containment first
        run: npx playwright test test/browser/monster-master-controls.spec.mjs test/browser/monster-master-option-hit-testing.spec.mjs test/browser/monster-master.spec.mjs test/browser/motion-polish.spec.mjs --config playwright.config.mjs --grep "mobile|horizontal overflow"
      - name: Prove illustrated grounding
        run: npx playwright test test/visual/monster-master-illustrated-grounding.spec.mjs --config playwright.visual.config.mjs
      - name: Commit clean fixes
        if: success()
        run: |
          rm -f .github/workflows/monster-master-grounding-mobile-fix.yml
          rm -f .github/workflows/monster-master-grounding-review-fix-v2.yml
          rm -f scripts/monster-master-grounding-review-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(monster-master): align illustrated HUD and mobile containment"
          git push origin HEAD:fix/monster-master-arena-grounding

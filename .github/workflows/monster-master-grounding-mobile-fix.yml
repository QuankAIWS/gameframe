name: Monster Master Grounding Mobile Fix

on:
  push:
    branches: [fix/monster-master-arena-grounding]
    paths: [.github/workflows/monster-master-grounding-mobile-fix.yml]

permissions:
  contents: write

jobs:
  fix-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monster-master-arena-grounding
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Remove stale navigation override from illustration layer
        shell: python
        run: |
          from pathlib import Path
          path = Path('public/monster-master-trainer-asset.js')
          text = path.read_text()
          start = text.index('    /* Monster Master adds Setup to the shared destination row.')
          end = text.index('\n  `;\n  document.head.append(style);', start)
          path.write_text(text[:start] + text[end:])

          test_path = Path('src/browser/monster-master-trainer-asset.test.mjs')
          test_text = test_path.read_text()
          test_start = test_text.index('test("Monster Master keeps its Setup destination usable at compact desktop widths"')
          test_end = test_text.index('test("every approved Arena illustration is available to world sprites and portraits"', test_start)
          test_path.write_text(test_text[:test_start] + test_text[test_end:])
      - name: Focused static proof
        run: |
          node --check public/monster-master-trainer-asset.js
          node --test src/browser/monster-master-trainer-asset.test.mjs src/browser/monster-master-pixi-illustrated-assets.test.mjs
          npm run check:monster-master-pixi
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove grounding and mobile containment
        run: |
          npx playwright test test/visual/monster-master-illustrated-grounding.spec.mjs --config playwright.visual.config.mjs
          npx playwright test test/browser/monster-master-controls.spec.mjs test/browser/monster-master-option-hit-testing.spec.mjs test/browser/monster-master.spec.mjs test/browser/motion-polish.spec.mjs --config playwright.config.mjs --grep "mobile|horizontal overflow"
      - name: Commit clean fix
        if: success()
        run: |
          rm .github/workflows/monster-master-grounding-mobile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(monster-master): keep grounding changes out of navigation"
          git push origin HEAD:fix/monster-master-arena-grounding

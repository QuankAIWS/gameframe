name: Materialize Arena Roster Visual Tests
on:
  push:
    branches: [agent/monster-master-arena-roster-selection]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monster-master-arena-roster-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - run: node .github/patch-arena-roster-visual-tests.mjs
      - run: |
          node --check test/visual/player-ui-regressions.spec.mjs
          node --check test/visual/player-ui-review.spec.mjs
      - name: Commit clean visual test updates
        run: |
          rm .github/patch-arena-roster-visual-tests.mjs
          rm .github/workflows/materialize-arena-roster-visual-tests.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Align Arena visual coverage with selectable rosters"
          git push origin HEAD:agent/monster-master-arena-roster-selection

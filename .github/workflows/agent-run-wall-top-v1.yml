name: Run raised barrier cap integration

on:
  push:
    branches:
      - agent/rpg-rendering-contract-terrain-geometry
    paths:
      - ".github/asset-payload/wall-top-v1.trigger"

permissions:
  contents: write

concurrency:
  group: run-wall-top-v1
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out terrain branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpg-rendering-contract-terrain-geometry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved wall-top asset
        run: python scripts/apply-wall-top-v1.py

      - name: Build committed Pixi bundle
        run: npm run build:monster-master-pixi

      - name: Verify terrain and asset contracts
        run: node --test src/browser/monster-master-terrain-geometry.test.mjs src/browser/monster-master-ground-asset-contract.test.mjs src/browser/monster-master-wall-top-asset-contract.test.mjs

      - name: Verify browser syntax and renderer architecture
        run: |
          npm run check:browser
          node --experimental-strip-types --test src/browser/monster-master-art-contract.test.ts
          npm run check:monster-master-pixi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Monster Master journeys
        run: npx playwright test test/browser/monster-master.spec.mjs test/browser/monster-master-controls.spec.mjs test/browser/motion-polish.spec.mjs --grep "Monster Master" --config playwright.config.mjs

      - name: Capture terrain screenshots
        run: npx playwright test test/visual/monster-master-pixi.spec.mjs test/visual/monster-master-results-and-depth.spec.mjs --config playwright.visual.config.mjs

      - name: Upload terrain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-top-v1-${{ github.run_id }}
          path: |
            visual-results/**/*.png
            visual-results/**/*.zip
            test-results/**/*.png
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 10

      - name: Commit validated wall-top asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/assets/monster-master/terrain/raised-barrier-cap \
            planning/monster-master/assets/raised-barrier-cap-grassland-stone-v1.md \
            src/browser/monster-master-wall-top-asset-contract.test.mjs \
            src/browser/monster-master-pixi-entry.js \
            public/monster-master-pixi-bundle.js
          git diff --cached --check
          git commit -m "Integrate grassland stone barrier cap asset"
          git push origin HEAD:agent/rpg-rendering-contract-terrain-geometry

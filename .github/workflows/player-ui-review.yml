name: Feature UI Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/player-ui-review.yml"
      - "scripts/ui-test-scope.mjs"
      - "scripts/ui-test-scope.test.mjs"
      - "public/**"
      - "planning/monster-master-rules.md"
      - "planning/monster-master/assets/**"
      - "scripts/build-monster-master-pixi.mjs"
      - "scripts/monster-master-*.mjs"
      - "scripts/cascade-profile.mjs"
      - "scripts/cascade-profile-compare.mjs"
      - "scripts/cascade-persona-calibrate.mjs"
      - "scripts/cascade-fragility.mjs"
      - "scripts/cascade-playtest-analyze.mjs"
      - "scripts/cascade-archive-profile.mjs"
      - "scripts/cascade-archive-check.mjs"
      - "data/cascade/difficulty-archive/**"
      - "planning/cascade-testing-methodology.md"
      - "src/browser/player-*"
      - "src/browser/monster-master*"
      - "src/cloudflare/player-*"
      - "src/cloudflare/cascade-telemetry-*.ts"
      - "src/server/in-memory-player-platform.ts"
      - "src/games/cascade/**"
      - "src/games/monster-master/**"
      - "test/browser/casual-games.spec.mjs"
      - "test/browser/cascade*.spec.mjs"
      - "test/browser/game-hub-navigation.spec.mjs"
      - "test/browser/player-platform.spec.mjs"
      - "test/browser/monster-master*.spec.mjs"
      - "test/browser/motion-polish.spec.mjs"
      - "test/workerd/player-progression.test.ts"
      - "test/visual/casual-games-destination.spec.mjs"
      - "test/visual/cascade*.spec.mjs"
      - "test/visual/player-platform.spec.mjs"
      - "test/visual/player-ui-review.spec.mjs"
      - "test/visual/player-ui-regressions.spec.mjs"
      - "test/visual/monster-master*.spec.mjs"
      - "playwright.config.mjs"
      - "playwright.visual.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: feature-ui-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      shell: ${{ steps.classify.outputs.shell }}
      casual: ${{ steps.classify.outputs.casual }}
      cascadeUi: ${{ steps.classify.outputs.cascadeUi }}
      cascadeProfile: ${{ steps.classify.outputs.cascadeProfile }}
      cascadeArchive: ${{ steps.classify.outputs.cascadeArchive }}
      cascadeTelemetry: ${{ steps.classify.outputs.cascadeTelemetry }}
      monsterMaster: ${{ steps.classify.outputs.monsterMaster }}
      playerPlatform: ${{ steps.classify.outputs.playerPlatform }}
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Verify UI scope classifier
        run: node --test scripts/ui-test-scope.test.mjs

      - name: Classify changed UI features
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ui-test-scope.mjs --all --github-output "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/ui-test-scope.mjs --github-output "$GITHUB_OUTPUT"
          fi

      - name: Report selected lanes
        run: |
          echo "### Feature UI lanes" >> "$GITHUB_STEP_SUMMARY"
          echo "- shared shell: ${{ steps.classify.outputs.shell }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Casual Games: ${{ steps.classify.outputs.casual }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cascade UI: ${{ steps.classify.outputs.cascadeUi }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cascade 600-level solver + human profile: ${{ steps.classify.outputs.cascadeProfile }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cascade difficulty archive: ${{ steps.classify.outputs.cascadeArchive }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cascade telemetry: ${{ steps.classify.outputs.cascadeTelemetry }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Monster Master: ${{ steps.classify.outputs.monsterMaster }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Player Platform: ${{ steps.classify.outputs.playerPlatform }}" >> "$GITHUB_STEP_SUMMARY"

  shell:
    needs: scope
    if: needs.scope.outputs.shell == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Shared shell syntax
        run: |
          node --check public/app.js
          node --check public/auth-launcher.js
          node --check public/game-hub.js
          node --check public/gameframe-nav.js
      - name: Shared navigation browser journey
        run: npx playwright test test/browser/game-hub-navigation.spec.mjs --config playwright.config.mjs
      - name: Shared shell visual regressions
        run: npx playwright test test/visual/player-ui-review.spec.mjs test/visual/player-ui-regressions.spec.mjs --config playwright.visual.config.mjs
      - name: Upload shared shell screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-shell-ui-review-${{ github.run_id }}
          path: |
            visual-results/player-ui-review
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7

  casual:
    needs: scope
    if: needs.scope.outputs.casual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Casual Games browser smoke
        run: npx playwright test test/browser/casual-games.spec.mjs --config playwright.config.mjs
      - name: Casual Games desktop and mobile visual review
        run: npx playwright test test/visual/casual-games-destination.spec.mjs --config playwright.visual.config.mjs
      - name: Upload Casual Games screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casual-games-ui-review-${{ github.run_id }}
          path: |
            visual-results/player-ui-review/casual-games-*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

  cascade-ui:
    needs: scope
    if: needs.scope.outputs.cascadeUi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Cascade syntax
        run: |
          for file in public/cascade*.js; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Cascade browser journeys
        run: npx playwright test test/browser/cascade*.spec.mjs --config playwright.config.mjs
      - name: Cascade visual regressions
        run: npx playwright test test/visual/cascade*.spec.mjs --config playwright.visual.config.mjs
      - name: Upload Cascade screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-ui-review-${{ github.run_id }}
          path: |
            visual-results/player-ui-review/cascade-*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

  cascade-archive:
    needs: scope
    if: needs.scope.outputs.cascadeArchive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Validate Cascade difficulty archive
        run: |
          node --check scripts/cascade-archive-profile.mjs
          node --check scripts/cascade-archive-check.mjs
          npm run cascade:archive:check

  cascade-profile:
    needs: scope
    if: needs.scope.outputs.cascadeProfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cascade engine and persistent-special contracts
        run: |
          npm run cascade:test
          node --test src/games/cascade/cascade-special-engine.test.mjs
      - name: Cascade 750-level solver and human difficulty profile
        run: npm run cascade:profile -- --runs=6 --json=cascade-profile.json
      - name: Upload Cascade difficulty profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-difficulty-profile-${{ github.run_id }}
          path: cascade-profile.json
          if-no-files-found: warn
          retention-days: 14

  cascade-expansion-profile:
    needs: scope
    if: needs.scope.outputs.cascadeProfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Profile levels 601-750 with larger human sample
        run: npm run cascade:profile -- --from=601 --to=750 --runs=8 --human-runs=20 --json=cascade-profile-deep.json
      - name: Upload expansion Cascade difficulty profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-expansion-difficulty-profile-${{ github.run_id }}
          path: cascade-profile-deep.json
          if-no-files-found: warn
          retention-days: 14

  cascade-fragility:
    needs: scope
    if: needs.scope.outputs.cascadeProfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Scan levels 601-750 move fragility
        run: npm run cascade:fragility -- --from=601 --to=750 --runs=12 --strategy=human-skilled | tee cascade-fragility.txt
      - name: Upload Cascade fragility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-fragility-${{ github.run_id }}
          path: cascade-fragility.txt
          if-no-files-found: warn
          retention-days: 14

  cascade-telemetry:
    needs: scope
    if: needs.scope.outputs.cascadeTelemetry == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cascade telemetry syntax
        run: |
          node --check public/cascade-admin-telemetry.js
          node --check public/cascade-telemetry-sync.js
      - name: Cascade telemetry contracts
        run: node --experimental-strip-types --test src/cloudflare/cascade-telemetry-object-runtime.test.ts src/cloudflare/cascade-telemetry-edge.test.ts

  monster-master:
    needs: scope
    if: needs.scope.outputs.monsterMaster == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify committed Pixi bundle
        run: npm run check:monster-master-pixi
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Monster Master syntax
        run: |
          for file in public/monster-master*.js src/browser/monster-master*.js scripts/build-monster-master-pixi.mjs scripts/monster-master-*.mjs; do
            if [ -f "$file" ]; then node --check "$file"; fi
          done
      - name: Monster Master contracts
        run: |
          node --experimental-strip-types --test \
            src/browser/monster-master-ground-asset-contract.test.mjs \
            src/browser/monster-master-wall-top-asset-contract.test.mjs \
            src/browser/monster-master-cliff-face-asset-contract.test.mjs \
            src/browser/monster-master-terrain-geometry.test.mjs \
            src/browser/monster-master-art-contract.test.ts \
            src/browser/monster-master-option-layer-contract.test.mjs \
            src/games/monster-master/index.test.ts \
            src/games/monster-master/repository-contract.test.ts \
            src/games/monster-master/delivery-contract.test.ts \
            src/games/monster-master/checkpoint-contract.test.ts
      - name: Monster Master browser journeys
        run: npx playwright test test/browser/monster-master*.spec.mjs test/browser/motion-polish.spec.mjs --config playwright.config.mjs
      - name: Monster Master visual regressions
        run: npx playwright test test/visual/monster-master*.spec.mjs --config playwright.visual.config.mjs
      - name: Upload Monster Master screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monster-master-ui-review-${{ github.run_id }}
          path: |
            visual-results/**/*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

  player-platform:
    needs: scope
    if: needs.scope.outputs.playerPlatform == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Player platform syntax
        run: |
          node --check public/gameframe-nav.js
          node --check public/home-dashboard.js
          node --check public/profile-app.js
          node --check public/leaderboard-app.js
          node --check public/matches-app.js
          node --check public/cascade-progression-sync.js
      - name: Player platform contracts
        run: |
          node --experimental-strip-types --test \
            src/browser/player-navigation-contract.test.ts \
            src/browser/player-platform-extension-contract.test.ts \
            src/cloudflare/player-platform-object-runtime.test.ts \
            src/cloudflare/player-platform-cascade-progression-edge-roundtrip.test.ts
          npx vitest run --config vitest.config.ts test/workerd/player-progression.test.ts --max-workers=1 --no-isolate
      - name: Player platform browser journeys
        run: npx playwright test test/browser/player-platform.spec.mjs --config playwright.config.mjs
      - name: Player platform desktop and mobile visual review
        run: npx playwright test test/visual/player-platform.spec.mjs --config playwright.visual.config.mjs
      - name: Upload player platform screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-platform-ui-review-${{ github.run_id }}
          path: |
            visual-results/player-ui-review/home-*.png
            visual-results/player-ui-review/profile-*.png
            visual-results/player-ui-review/leaderboard-*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

name: Player Platform UI Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "public/gameframe-nav.js"
      - "public/home-dashboard.js"
      - "public/profile.html"
      - "public/profile-app.js"
      - "public/leaderboard.html"
      - "public/leaderboard-app.js"
      - "public/matches.html"
      - "public/matches-app.js"
      - "public/player-platform.css"
      - "public/player-social.css"
      - "public/cascade-progression-sync.js"
      - "src/browser/player-navigation-contract.test.ts"
      - "src/browser/player-platform-extension-contract.test.ts"
      - "src/cloudflare/player-progression.ts"
      - "src/cloudflare/player-platform-object-runtime.ts"
      - "src/cloudflare/player-platform-object-runtime.test.ts"
      - "src/cloudflare/player-platform-coordinator.ts"
      - "src/server/in-memory-player-platform.ts"
      - "test/browser/player-platform.spec.mjs"
      - "test/workerd/player-progression.test.ts"
      - "test/visual/player-platform.spec.mjs"

permissions:
  contents: read

concurrency:
  group: player-platform-ui-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Player platform syntax gate
        run: |
          node --check public/gameframe-nav.js
          node --check public/home-dashboard.js
          node --check public/profile-app.js
          node --check public/leaderboard-app.js
          node --check public/matches-app.js
          node --check public/cascade-progression-sync.js

      - name: Player platform contracts
        run: |
          node --experimental-strip-types --test \
            src/browser/player-navigation-contract.test.ts \
            src/browser/player-platform-extension-contract.test.ts \
            src/cloudflare/player-platform-object-runtime.test.ts
          npx vitest run --config vitest.config.ts test/workerd/player-progression.test.ts --max-workers=1 --no-isolate

      - name: Player platform browser journeys
        run: npx playwright test test/browser/player-platform.spec.mjs --config playwright.config.mjs

      - name: Player platform desktop and mobile visual review
        run: npx playwright test test/visual/player-platform.spec.mjs --config playwright.visual.config.mjs

      - name: Upload player platform screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-platform-ui-review-${{ github.run_id }}
          path: |
            visual-results/player-ui-review/home-*.png
            visual-results/player-ui-review/profile-*.png
            visual-results/player-ui-review/leaderboard-*.png
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

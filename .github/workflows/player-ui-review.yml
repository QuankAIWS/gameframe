name: Player UI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/player-ui-review.yml"

permissions:
  contents: write

concurrency:
  group: terrain-foundation-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpg-rendering-contract-terrain-geometry
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install pinned dependencies
        run: |
          npm ci
          npm install --save-dev --save-exact sharp@0.34.3

      - name: Repair review findings
        run: |
          cat > /tmp/repair-terrain-foundation.mjs <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          async function replaceOnce(path, before, after) {
            const source = await readFile(path, "utf8");
            if (!source.includes(before)) {
              throw new Error(`Expected text not found in ${path}: ${before}`);
            }
            const updated = source.replace(before, after);
            if (updated === source) throw new Error(`No change made to ${path}`);
            await writeFile(path, updated);
          }

          await replaceOnce(
            "src/browser/monster-master-pixi-entry.js",
            "if (!sourceMap || !state.layers) return;",
            "if (!sourceMap || !state.layers || !state.textures) return;",
          );

          await replaceOnce(
            "scripts/run-tests.mjs",
            "} else if (entry.endsWith(\".test.ts\")) {",
            "} else if (entry.endsWith(\".test.ts\") || entry.endsWith(\".test.mjs\")) {",
          );
          await replaceOnce(
            "scripts/run-tests.mjs",
            "No TypeScript tests were found.",
            "No test files were found.",
          );

          const packagePath = "package.json";
          const packageJson = JSON.parse(await readFile(packagePath, "utf8"));
          packageJson.scripts["assets:terrain:build"] = "node scripts/monster-master-terrain-assets.mjs build";
          packageJson.scripts["assets:terrain:verify"] = "node scripts/monster-master-terrain-assets.mjs verify";
          packageJson.scripts["assets:build"] = "node scripts/clockwork-assets.mjs build && npm run assets:terrain:build";
          packageJson.scripts["assets:verify"] = "node scripts/clockwork-assets.mjs verify && npm run assets:terrain:verify";
          await writeFile(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          node /tmp/repair-terrain-foundation.mjs

      - name: Add deterministic terrain asset pipeline
        run: |
          cat > scripts/monster-master-terrain-assets.mjs <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { mkdir, readFile, writeFile } from "node:fs/promises";
          import { dirname } from "node:path";
          import sharp from "sharp";

          const SHARP_VERSION = "0.34.3";
          const assets = [
            {
              manifestPath: "public/assets/monster-master/terrain/grass-ground/manifest.json",
              runtimePath: "public/assets/monster-master/terrain/grass-ground/grass-ground-v1-128.webp",
              masterPath: "public/assets/monster-master/terrain/grass-ground/source/grass-ground-v1-master.png",
              masterWidth: 2048,
              masterHeight: 2048,
              runtimeHashLocation: ["source", "runtimeSha256"],
            },
            {
              manifestPath: "public/assets/monster-master/terrain/raised-barrier-cap/manifest.json",
              runtimePath: "public/assets/monster-master/terrain/raised-barrier-cap/raised-barrier-cap-grassland-stone-v1-128.webp",
              masterPath: "public/assets/monster-master/terrain/raised-barrier-cap/source/raised-barrier-cap-grassland-stone-v1-master.png",
              masterWidth: 1024,
              masterHeight: 1024,
              runtimeHashLocation: ["source", "runtimeSha256"],
            },
            {
              manifestPath: "public/assets/monster-master/terrain/cliff-face/manifest.json",
              runtimePath: "public/assets/monster-master/terrain/cliff-face/cliff-face-grassland-stone-v1-128.webp",
              masterPath: "public/assets/monster-master/terrain/cliff-face/source/cliff-face-grassland-stone-v1-master.png",
              masterWidth: 1024,
              masterHeight: 1024,
              runtimeHashLocation: ["runtime", "sha256"],
            },
          ];

          function sha256(bytes) {
            return createHash("sha256").update(bytes).digest("hex");
          }

          function setNested(target, [section, key], value) {
            target[section] ??= {};
            target[section][key] = value;
          }

          async function renderMaster(runtimeBytes, asset) {
            return sharp(runtimeBytes)
              .resize(asset.masterWidth, asset.masterHeight, { fit: "fill", kernel: "nearest" })
              .png({ compressionLevel: 9, adaptiveFiltering: false })
              .toBuffer();
          }

          async function renderRuntime(masterBytes) {
            return sharp(masterBytes)
              .resize(128, 128, { fit: "fill", kernel: "nearest" })
              .webp({ lossless: true, effort: 6 })
              .toBuffer();
          }

          async function bootstrapAsset(asset) {
            const currentRuntime = await readFile(asset.runtimePath);
            const masterBytes = await renderMaster(currentRuntime, asset);
            const runtimeBytes = await renderRuntime(masterBytes);
            await mkdir(dirname(asset.masterPath), { recursive: true });
            await writeFile(asset.masterPath, masterBytes);
            await writeFile(asset.runtimePath, runtimeBytes);

            const manifest = JSON.parse(await readFile(asset.manifestPath, "utf8"));
            manifest.source.preparedMasterPath = asset.masterPath;
            manifest.source.preparedMasterDimensions = [asset.masterWidth, asset.masterHeight];
            manifest.source.preparedMasterSha256 = sha256(masterBytes);
            manifest.source.transform = {
              tool: "sharp",
              version: SHARP_VERSION,
              masterBootstrap: {
                input: "accepted runtime derivative",
                resizeKernel: "nearest",
                outputFormat: "png",
                compressionLevel: 9,
              },
              runtimeDerivative: {
                width: 128,
                height: 128,
                resizeKernel: "nearest",
                outputFormat: "webp",
                lossless: true,
                effort: 6,
              },
            };
            setNested(manifest, asset.runtimeHashLocation, sha256(runtimeBytes));
            manifest.runtime.sha256 = sha256(runtimeBytes);
            await writeFile(asset.manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          }

          async function buildAsset(asset) {
            const masterBytes = await readFile(asset.masterPath);
            await writeFile(asset.runtimePath, await renderRuntime(masterBytes));
          }

          async function verifyAsset(asset) {
            const manifest = JSON.parse(await readFile(asset.manifestPath, "utf8"));
            const masterBytes = await readFile(asset.masterPath);
            const runtimeBytes = await readFile(asset.runtimePath);
            const rebuiltRuntime = await renderRuntime(masterBytes);
            assert.equal(manifest.source.preparedMasterPath, asset.masterPath);
            assert.equal(manifest.source.transform.tool, "sharp");
            assert.equal(manifest.source.transform.version, SHARP_VERSION);
            assert.equal(sha256(masterBytes), manifest.source.preparedMasterSha256);
            assert.deepEqual(runtimeBytes, rebuiltRuntime, `${asset.runtimePath} is not reproducible from its committed master`);
            assert.equal(sha256(runtimeBytes), manifest.runtime.sha256);
            const [section, key] = asset.runtimeHashLocation;
            assert.equal(sha256(runtimeBytes), manifest[section][key]);
          }

          const mode = process.argv[2];
          if (!new Set(["bootstrap", "build", "verify"]).has(mode)) {
            throw new Error("Usage: node scripts/monster-master-terrain-assets.mjs <bootstrap|build|verify>");
          }
          for (const asset of assets) {
            if (mode === "bootstrap") await bootstrapAsset(asset);
            if (mode === "build") await buildAsset(asset);
            if (mode === "verify") await verifyAsset(asset);
          }
          NODE
          node scripts/monster-master-terrain-assets.mjs bootstrap

      - name: Rebuild Pixi bundle
        run: npm run build:monster-master-pixi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Focused terrain checks
        run: |
          npm run assets:terrain:verify
          node --experimental-strip-types --test \
            src/browser/monster-master-terrain-geometry.test.mjs \
            src/browser/monster-master-ground-asset-contract.test.mjs \
            src/browser/monster-master-wall-top-asset-contract.test.mjs \
            src/browser/monster-master-cliff-face-asset-contract.test.mjs
          npm run check:monster-master-pixi
          npm run check:browser

      - name: Complete local validation
        run: npm run validate

      - name: Restore normal Player UI Review workflow
        run: |
          cat > .github/workflows/player-ui-review.yml <<'YAML'
          name: Player UI Review

          on:
            workflow_dispatch:
            pull_request:
              types: [opened, synchronize, reopened, ready_for_review]
              paths:
                - "public/**"
                - "planning/monster-master-rules.md"
                - "planning/monster-master/assets/**"
                - "scripts/build-monster-master-pixi.mjs"
                - "scripts/monster-master-terrain-assets.mjs"
                - "src/browser/monster-master-pixi-entry.js"
                - "src/browser/monster-master-ground-asset-contract.test.mjs"
                - "src/browser/monster-master-wall-top-asset-contract.test.mjs"
                - "src/browser/monster-master-cliff-face-asset-contract.test.mjs"
                - "src/browser/monster-master-terrain-geometry.js"
                - "src/browser/monster-master-terrain-geometry.test.mjs"
                - "src/browser/player-navigation-contract.test.ts"
                - "src/browser/monster-master-art-contract.test.ts"
                - "src/browser/othello-runtime-contract.test.ts"
                - "src/games/monster-master/index.ts"
                - "src/games/monster-master/index.test.ts"
                - "src/games/monster-master/repository-contract.test.ts"
                - "src/games/monster-master/delivery-contract.test.ts"
                - "test/browser/monster-master.spec.mjs"
                - "test/browser/monster-master-controls.spec.mjs"
                - "test/browser/motion-polish.spec.mjs"
                - "test/visual/player-ui-review.spec.mjs"
                - "test/visual/player-ui-regressions.spec.mjs"
                - "test/visual/monster-master-pixi.spec.mjs"
                - "test/visual/monster-master-cardinal-camera.spec.mjs"
                - "test/visual/monster-master-results-and-depth.spec.mjs"
                - "test/visual/monster-master-trainer-shell.spec.mjs"
                - "THIRD_PARTY_NOTICES.md"
                - "playwright.config.mjs"
                - "playwright.visual.config.mjs"
                - "package.json"
                - "package-lock.json"
                - ".github/workflows/player-ui-review.yml"

          permissions:
            contents: read

          concurrency:
            group: player-ui-review-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          jobs:
            capture:
              if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
              runs-on: ubuntu-latest
              timeout-minutes: 30
              steps:
                - name: Check out candidate
                  uses: actions/checkout@v4

                - name: Set up Node
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22
                    cache: npm

                - name: Install dependencies
                  run: npm ci

                - name: Verify committed Pixi bundle
                  run: npm run check:monster-master-pixi

                - name: Install Playwright Chromium
                  run: npx playwright install --with-deps chromium

                - name: Browser syntax gate
                  run: npm run check:browser

                - name: Player navigation, renderer geometry, asset, game, and Monster Master rule contracts
                  run: node --experimental-strip-types --test src/browser/monster-master-ground-asset-contract.test.mjs src/browser/monster-master-wall-top-asset-contract.test.mjs src/browser/monster-master-cliff-face-asset-contract.test.mjs src/browser/monster-master-terrain-geometry.test.mjs src/browser/player-navigation-contract.test.ts src/browser/monster-master-art-contract.test.ts src/browser/othello-runtime-contract.test.ts src/games/monster-master/index.test.ts src/games/monster-master/repository-contract.test.ts src/games/monster-master/delivery-contract.test.ts

                - name: Canonical Monster Master Pixi journeys
                  run: npx playwright test test/browser/monster-master.spec.mjs test/browser/monster-master-controls.spec.mjs test/browser/motion-polish.spec.mjs --grep "Monster Master" --config playwright.config.mjs

                - name: Capture player UI screenshots and cross-game regressions
                  run: npx playwright test test/visual/player-ui-review.spec.mjs test/visual/player-ui-regressions.spec.mjs test/visual/monster-master-pixi.spec.mjs test/visual/monster-master-cardinal-camera.spec.mjs test/visual/monster-master-results-and-depth.spec.mjs test/visual/monster-master-trainer-shell.spec.mjs --config playwright.visual.config.mjs

                - name: Upload player UI screenshots
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: player-ui-review-${{ github.run_id }}
                    path: |
                      visual-results/player-ui-review
                      visual-results/**/*.zip
                      visual-results/**/*.png
                      test-results/**/*.zip
                      test-results/**/*.png
                    if-no-files-found: warn
                    retention-days: 10
          YAML
          rm -f .github/workflows/terrain-foundation-repair.yml

      - name: Commit repaired terrain foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete terrain foundation review"
          git push origin HEAD:agent/rpg-rendering-contract-terrain-geometry

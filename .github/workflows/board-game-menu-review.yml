name: Board Game Menu Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/board-game-menu-review.yml"
      - "public/board-game-menu.css"
      - "public/board-game-menu.js"
      - "public/board-menu-controls.js"
      - "public/board-surface-init.js"
      - "public/board-local-match.js"
      - "public/local-board-session.js"
      - "public/local-tic-board.js"
      - "public/local-checkers-board.js"
      - "public/tic-tac-toe-noir.js"
      - "test/board-local-match.test.mjs"
      - "test/browser/board-game-menu.spec.mjs"
      - "test/browser/authenticated-invitation.spec.mjs"

permissions:
  contents: read

concurrency:
  group: board-game-menu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  board-menu-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Board menu syntax
        run: |
          node --check public/board-game-menu.js
          node --check public/board-menu-controls.js
          node --check public/board-surface-init.js
          node --check public/board-local-match.js
          node --check public/local-board-session.js
          node --check public/local-tic-board.js
          node --check public/local-checkers-board.js
          node --check public/tic-tac-toe-noir.js

      - name: Local board rules
        run: node --test test/board-local-match.test.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Board menu browser journeys
        run: >-
          npx playwright test
          test/browser/board-game-menu.spec.mjs
          test/browser/authenticated-invitation.spec.mjs
          --config playwright.config.mjs

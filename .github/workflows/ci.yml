name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: scribbles-gameframe-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate candidate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit candidate dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Lock Playwright browser dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Validate development candidate
        run: npm run validate

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gf-0003-browser-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

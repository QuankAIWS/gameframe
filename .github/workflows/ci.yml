name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: write

concurrency:
  group: scribbles-gameframe-prepublication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact public-readiness candidate
        uses: actions/checkout@v4
        with:
          ref: agent/public-readiness-final

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Commit generated dependency lock when needed
        run: |
          if git status --short -- package-lock.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Workers validation dependencies"
            git push origin HEAD:agent/public-readiness-final
          fi

      - name: Record validated candidate
        run: git rev-parse HEAD

      - name: Validate exact public-readiness candidate
        run: npm run validate

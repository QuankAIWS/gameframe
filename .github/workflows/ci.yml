name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          elif node -e "const p=require('./package.json'); process.exit(Object.keys(p.dependencies||{}).length + Object.keys(p.devDependencies||{}).length > 0 ? 0 : 1)"; then
            npm install --no-audit --no-fund
          fi

      - name: Emit generated dependency lock for review
        if: ${{ hashFiles('package-lock.json') != '' }}
        run: |
          echo BEGIN_PACKAGE_LOCK_BASE64
          base64 -w 0 package-lock.json
          echo
          echo END_PACKAGE_LOCK_BASE64

      - name: Validate final feature candidate
        run: npm run validate

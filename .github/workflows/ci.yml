name: Canonical Validation

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-doc-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event.label.name == 'canonical-validation' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out documentation-hygiene candidate
        uses: actions/checkout@v4
        with:
          ref: agent/public-documentation-hygiene
          fetch-depth: 0

      - name: Record validated candidate
        run: git rev-parse HEAD

      - name: Scan reachable history for high-confidence secrets
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys

          patterns = {
              "private key": re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
              "AWS access key": re.compile(r"\b(?:AKIA|ASIA)[0-9A-Z]{16}\b"),
              "GitHub token": re.compile(r"\bgh[pousr]_[A-Za-z0-9_]{36,255}\b|\bgithub_pat_[A-Za-z0-9_]{20,255}\b"),
              "OpenAI-style secret": re.compile(r"\bsk-[A-Za-z0-9]{20,}\b"),
              "Stripe live secret": re.compile(r"\bsk_live_[A-Za-z0-9]{16,}\b"),
              "Google API key": re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b"),
              "Slack token": re.compile(r"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              "npm token": re.compile(r"\bnpm_[A-Za-z0-9]{36}\b"),
              "basic-auth URL": re.compile(r"https?://[^\s/:]+:[^\s/@]+@[^\s]+"),
          }

          findings = []
          objects = subprocess.check_output(
              ["git", "rev-list", "--objects", "--all"], text=True
          ).splitlines()

          for object_line in objects:
              parts = object_line.split(" ", 1)
              sha = parts[0]
              path = parts[1] if len(parts) == 2 else "<unknown>"
              object_type = subprocess.check_output(
                  ["git", "cat-file", "-t", sha], text=True
              ).strip()
              if object_type != "blob":
                  continue
              data = subprocess.check_output(["git", "cat-file", "-p", sha])
              if len(data) > 5_000_000 or b"\0" in data:
                  continue
              text = data.decode("utf-8", errors="ignore")
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append((label, path, sha))

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          for path in tracked:
              lowered = path.lower()
              basename = lowered.rsplit("/", 1)[-1]
              if basename in {".env", ".dev.vars"} or basename.endswith(
                  (".pem", ".p12", ".pfx", ".jks", ".keystore")
              ) or (basename.endswith(".key") and not basename.endswith(".pub.key")):
                  findings.append(("tracked secret-bearing filename", path, "current"))
              if lowered.startswith(("credentials/", "secrets/")):
                  findings.append(("tracked sensitive directory", path, "current"))

          if findings:
              for label, path, sha in findings:
                  print(f"{label}: {path} ({sha})")
              sys.exit("High-confidence secret scan found material requiring review.")

          print("High-confidence secret scan passed.")
          PY

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate exact documentation-hygiene candidate
        run: npm run validate

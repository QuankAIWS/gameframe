name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-prepublication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out exact public-readiness candidate
        uses: actions/checkout@v4
        with:
          ref: agent/public-readiness-final

      - name: Record validated candidate
        run: git rev-parse HEAD

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Emit dependency lock for review
        run: |
          echo BEGIN_PACKAGE_LOCK_BASE64
          base64 -w 0 package-lock.json
          echo
          echo END_PACKAGE_LOCK_BASE64

      - name: Validate exact public-readiness candidate
        run: npm run validate

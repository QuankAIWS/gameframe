name: Canonical Validation

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-doc-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event.label.name == 'canonical-validation' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Check out documentation-hygiene candidate
        uses: actions/checkout@v4
        with:
          ref: agent/public-documentation-hygiene
          fetch-depth: 0

      - name: Record validated candidate
        run: git rev-parse HEAD

      - name: Select Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Scan reachable history for high-confidence secrets
        shell: bash
        run: |
          node <<'JS'
          const { execFileSync } = require("node:child_process");

          const patterns = new Map([
            ["private key", /-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----/],
            ["AWS access key", /\b(?:AKIA|ASIA)[0-9A-Z]{16}\b/],
            ["GitHub token", /\bgh[pousr]_[A-Za-z0-9_]{36,255}\b|\bgithub_pat_[A-Za-z0-9_]{20,255}\b/],
            ["OpenAI-style secret", /\bsk-[A-Za-z0-9]{20,}\b/],
            ["Stripe live secret", /\bsk_live_[A-Za-z0-9]{16,}\b/],
            ["Google API key", /\bAIza[0-9A-Za-z_-]{35}\b/],
            ["Slack token", /\bxox[baprs]-[A-Za-z0-9-]{20,}\b/],
            ["npm token", /\bnpm_[A-Za-z0-9]{36}\b/],
            ["basic-auth URL", /https?:\/\/[^\s/:]+:[^\s/@]+@[^\s]+/],
          ]);

          const findings = [];
          const objects = execFileSync("git", ["rev-list", "--objects", "--all"], {
            encoding: "utf8",
          }).trim().split("\n").filter(Boolean);

          for (const objectLine of objects) {
            const separator = objectLine.indexOf(" ");
            const sha = separator === -1 ? objectLine : objectLine.slice(0, separator);
            const path = separator === -1 ? "<unknown>" : objectLine.slice(separator + 1);
            const objectType = execFileSync("git", ["cat-file", "-t", sha], {
              encoding: "utf8",
            }).trim();
            if (objectType !== "blob") continue;
            const data = execFileSync("git", ["cat-file", "-p", sha], {
              encoding: "buffer",
              maxBuffer: 6_000_000,
            });
            if (data.length > 5_000_000 || data.includes(0)) continue;
            const text = data.toString("utf8");
            for (const [label, pattern] of patterns) {
              if (pattern.test(text)) findings.push({ label, path, sha });
            }
          }

          const tracked = execFileSync("git", ["ls-files"], {
            encoding: "utf8",
          }).trim().split("\n").filter(Boolean);

          for (const path of tracked) {
            const lowered = path.toLowerCase();
            const basename = lowered.split("/").at(-1);
            const secretFile =
              basename === ".env" ||
              basename === ".dev.vars" ||
              [".pem", ".p12", ".pfx", ".jks", ".keystore"].some((suffix) =>
                basename.endsWith(suffix),
              ) ||
              (basename.endsWith(".key") && !basename.endsWith(".pub.key"));
            if (secretFile) {
              findings.push({ label: "tracked secret-bearing filename", path, sha: "current" });
            }
            if (lowered.startsWith("credentials/") || lowered.startsWith("secrets/")) {
              findings.push({ label: "tracked sensitive directory", path, sha: "current" });
            }
          }

          if (findings.length > 0) {
            for (const finding of findings) {
              console.error(`${finding.label}: ${finding.path} (${finding.sha})`);
            }
            process.exitCode = 1;
            throw new Error("High-confidence secret scan found material requiring review.");
          }

          console.log("High-confidence secret scan passed.");
          JS

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate exact documentation-hygiene candidate
        run: npm run validate

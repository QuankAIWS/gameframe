name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-canonical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Generate candidate dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Preserve candidate dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: gf-0003-package-lock
          path: package-lock.json
          retention-days: 1
          if-no-files-found: error

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Validate final feature candidate
        run: npm run validate

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gf-0003-browser-diagnostics
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

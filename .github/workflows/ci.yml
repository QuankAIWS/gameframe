name: Canonical Validation

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: scribbles-gameframe-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name || 'manual' }}
  cancel-in-progress: true

jobs:
  validate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'canonical-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Require committed dependency lock
        run: test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for browser acceptance
        run: npx playwright install --with-deps chromium

      - name: Validate final feature candidate
        run: npm run validate

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameframe-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  visual-review:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'visual-review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for curated visual review
        run: npx playwright install --with-deps chromium

      - name: Capture curated visual states
        run: npm run test:visual

      - name: Upload curated visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gameframe-visual-review-${{ github.run_id }}
          path: visual-results/
          retention-days: 7
          if-no-files-found: error

  visual-baseline-bootstrap:
    if: ${{ github.event_name == 'pull_request' && github.event.label.name == 'visual-baseline-bootstrap' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/browser-journey-visual-hardening' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the controlled feature branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Select Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for baseline generation
        run: npx playwright install --with-deps chromium

      - name: Generate the four accepted baselines
        run: npx playwright test --config playwright.visual-baseline.config.mjs --update-snapshots

      - name: Commit only generated baseline PNGs
        shell: bash
        run: |
          git add test/visual-baseline/__snapshots__/*.png
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -Ev '^test/visual-baseline/__snapshots__/[^/]+\.png$'; then
            echo "Unexpected file staged by visual baseline generation." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add canonical browser visual baselines"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

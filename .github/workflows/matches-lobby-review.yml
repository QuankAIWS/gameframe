name: Matches Lobby Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/matches-lobby-review.yml"
      - "public/matches.html"
      - "public/matches-app.js"
      - "public/player-platform.css"
      - "test/browser/matches-lobby.spec.mjs"

permissions:
  contents: read

concurrency:
  group: matches-lobby-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lobby-review:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Matches browser syntax
        run: node --check public/matches-app.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Matches lobby journey
        run: npx playwright test test/browser/matches-lobby.spec.mjs --config playwright.config.mjs

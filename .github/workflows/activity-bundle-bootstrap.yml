name: Bootstrap Activity Bundle

on:
  push:
    branches:
      - agent/gf-0004-discord-activity-client

permissions:
  contents: write

concurrency:
  group: activity-bundle-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.repository == 'QuankAIWS/scribbles-gameframe' && github.ref == 'refs/heads/agent/gf-0004-discord-activity-client'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out controlled feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/gf-0004-discord-activity-client
          fetch-depth: 0

      - name: Select pinned Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve exact dependency lock
        run: npm install --no-audit --no-fund

      - name: Build official Discord Activity SDK bundle
        run: npm run build:activity

      - name: Commit generated lock and bundle when changed
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json public/discord-activity-bootstrap.js
          if git diff --cached --quiet; then
            echo "Lock and bundle are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Lock and bundle the official Discord Activity SDK"
          git push origin HEAD:agent/gf-0004-discord-activity-client

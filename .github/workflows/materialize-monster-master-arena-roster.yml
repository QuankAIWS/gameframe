name: Materialize Monster Master Arena Roster
on:
  push:
    branches: [agent/monster-master-arena-roster-selection]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monster-master-arena-roster-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply authoritative roster patches
        run: |
          node .github/patch-arena-roster-server.mjs
          node .github/patch-arena-roster-app.mjs
          node .github/patch-arena-assets-registry.mjs
          node .github/patch-arena-assets-catalog.mjs
          node .github/patch-arena-roster-tests.mjs
      - name: Verify Arena roster slice
        run: |
          node --check public/monster-master-roster-builder.js
          node --check public/monster-master-app.js
          node --check public/monster-master-trainer-asset.js
          node --experimental-strip-types --test src/games/monster-master/repository-contract.test.ts
      - name: Commit final Arena roster slice
        run: |
          rm .github/patch-arena-roster-server.mjs
          rm .github/patch-arena-roster-app.mjs
          rm .github/patch-arena-assets-registry.mjs
          rm .github/patch-arena-assets-catalog.mjs
          rm .github/patch-arena-roster-tests.mjs
          rm .github/workflows/materialize-monster-master-arena-roster.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add selectable Monster Master Arena rosters"
          git push origin HEAD:agent/monster-master-arena-roster-selection

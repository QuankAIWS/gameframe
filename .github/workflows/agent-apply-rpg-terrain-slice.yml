name: Apply RPG terrain slice

on:
  push:
    branches:
      - agent/rpg-rendering-contract-terrain-geometry
    paths:
      - ".github/agent-payload/**"
      - ".github/workflows/agent-apply-rpg-terrain-slice.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - ".github/agent-payload/**"
      - ".github/workflows/agent-apply-rpg-terrain-slice.yml"
      - "src/browser/monster-master-terrain-geometry.js"
      - "src/browser/monster-master-terrain-geometry.test.mjs"

permissions:
  contents: write

concurrency:
  group: apply-rpg-terrain-slice-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out prepared branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpg-rendering-contract-terrain-geometry
          fetch-depth: 0

      - name: Apply prepared source package
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-payload/mm-slice.part* | base64 --decode > /tmp/mm-slice.tar.gz
          tar -xzf /tmp/mm-slice.tar.gz
          python - <<'PY'
          from pathlib import Path

          contract = Path("src/browser/monster-master-art-contract.test.ts")
          contract_source = contract.read_text().replace(
              "assert.doesNotMatch(pixiBridge, /function project/);",
              "assert.doesNotMatch(pixiBridge, /function project\\(/);",
          )
          contract.write_text(contract_source)

          renderer = Path("src/browser/monster-master-pixi-entry.js")
          source = renderer.read_text()
          save_camera = '''function saveCamera() {
            try {
              localStorage.setItem(CAMERA_STORAGE_KEY, JSON.stringify(state.camera));
            } catch {
              // Camera persistence is optional.
            }
          }
          '''
          commit_camera = save_camera + '''
          function commitCamera() {
            saveCamera();
            applyCamera();
            scheduleRender();
          }
          '''
          source = source.replace(save_camera, commit_camera, 1)
          source = source.replace(
              '''    saveCamera();
              scheduleRender();
            }, { passive: false });''',
              '''    commitCamera();
            }, { passive: false });''',
              1,
          )
          source = source.replace(
              '''  clampCamera();
            saveCamera();
            scheduleRender();
          }''',
              '''  clampCamera();
            commitCamera();
          }''',
              1,
          )
          source = source.replace(
              '''  state.camera.y = unit.position.y;
            saveCamera();
            scheduleRender();
          }''',
              '''  state.camera.y = unit.position.y;
            commitCamera();
          }''',
              1,
          )
          source = source.replace(
              '''  state.camera.y = (sourceMap.height - 1) / 2;
            saveCamera();
            scheduleRender();
          }''',
              '''  state.camera.y = (sourceMap.height - 1) / 2;
            commitCamera();
          }''',
              1,
          )
          source = source.replace(
              '''  state.unitsSignature = "";
            saveCamera();
            scheduleRender();
            updateCameraLabel();''',
              '''  state.unitsSignature = "";
            commitCamera();
            updateCameraLabel();''',
              1,
          )
          source = source.replace(
              '''["#monster-master-zoom-in", () => { state.camera.zoom = clamp(state.camera.zoom + 0.2, 0.6, 2.4); saveCamera(); scheduleRender(); }],''',
              '''["#monster-master-zoom-in", () => { state.camera.zoom = clamp(state.camera.zoom + 0.2, 0.6, 2.4); commitCamera(); }],''',
              1,
          )
          source = source.replace(
              '''["#monster-master-zoom-out", () => { state.camera.zoom = clamp(state.camera.zoom - 0.2, 0.6, 2.4); saveCamera(); scheduleRender(); }],''',
              '''["#monster-master-zoom-out", () => { state.camera.zoom = clamp(state.camera.zoom - 0.2, 0.6, 2.4); commitCamera(); }],''',
              1,
          )
          renderer.write_text(source)
          PY
          rm -rf .github/agent-payload
          rm -f .github/workflows/agent-apply-rpg-terrain-slice.yml
          rm -f public/monster-master-terrain-depth.js public/monster-master-terrain-depth.css

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build committed Pixi bundle
        run: npm run build:monster-master-pixi

      - name: Verify terrain geometry
        run: node --test src/browser/monster-master-terrain-geometry.test.mjs

      - name: Verify browser syntax
        run: npm run check:browser

      - name: Verify Monster Master architecture contract
        run: node --experimental-strip-types --test src/browser/monster-master-art-contract.test.ts

      - name: Verify committed Pixi bundle
        run: npm run check:monster-master-pixi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run canonical Monster Master journeys
        run: npx playwright test test/browser/monster-master.spec.mjs test/browser/monster-master-controls.spec.mjs test/browser/motion-polish.spec.mjs --grep "Monster Master" --config playwright.config.mjs

      - name: Capture the complete player UI matrix
        run: npx playwright test test/visual/player-ui-review.spec.mjs test/visual/player-ui-regressions.spec.mjs test/visual/monster-master-pixi.spec.mjs test/visual/monster-master-cardinal-camera.spec.mjs test/visual/monster-master-results-and-depth.spec.mjs test/visual/monster-master-trainer-shell.spec.mjs --config playwright.visual.config.mjs

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-terrain-slice-${{ github.run_id }}
          path: |
            visual-results/player-ui-review
            visual-results/**/*.zip
            visual-results/**/*.png
            test-results/**/*.zip
            test-results/**/*.png
          if-no-files-found: warn
          retention-days: 10

      - name: Commit validated slice
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Define RPG rendering contract and unify terrain geometry"
          git push origin HEAD:agent/rpg-rendering-contract-terrain-geometry

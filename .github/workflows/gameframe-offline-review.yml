name: GameFrame Offline Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/gameframe-offline-review.yml"
      - "public/index.html"
      - "public/sw.js"
      - "public/gameframe-pwa.js"
      - "public/gameframe-auth.js"
      - "public/auth-launcher.js"
      - "public/gameframe-offline-shell.js"
      - "public/gameframe-nav.js"
      - "public/gameframe-theme.js"
      - "public/casual-games.html"
      - "public/casual-games.js"
      - "public/cascade*.js"
      - "public/cascade*.css"
      - "public/cascade.html"
      - "public/leaderboard.html"
      - "public/leaderboard-app.js"
      - "public/othello*.js"
      - "public/othello*.css"
      - "public/othello.html"
      - "test/browser/gameframe-offline-shell.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: gameframe-offline-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-journey:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Offline shell syntax
        run: |
          node --check public/sw.js
          node --check public/gameframe-pwa.js
          node --check public/gameframe-auth.js
          node --check public/auth-launcher.js
          node --check public/gameframe-offline-shell.js
          node --check public/leaderboard-app.js
          node --check public/othello-launcher.js
          node --check public/othello-offline-mode.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Cold offline GameFrame journey
        run: npx playwright test test/browser/gameframe-offline-shell.spec.mjs --config playwright.config.mjs
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gameframe-offline-review-${{ github.run_id }}
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7

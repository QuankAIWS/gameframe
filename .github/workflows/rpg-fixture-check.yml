name: RPG Node Contract Check
run-name: RPG Node Contract Check · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    types: [labeled]
    paths:
      - ".github/workflows/rpg-fixture-check.yml"
      - "package.json"
      - "wrangler.jsonc"
      - "deploy/systemd/**"
      - "planning/fixtures/rpg/**"
      - "planning/rpg-gameframe-interface-contract.md"
      - "planning/rpg-player-shell.md"
      - "planning/rpg-signed-edge-authentication.md"
      - "planning/rpg-single-vm-deployment.md"
      - "public/game-hub.js"
      - "public/gameframe-nav.js"
      - "public/monster-master-rpg.html"
      - "public/monster-master-rpg.css"
      - "public/monster-master-rpg-*.css"
      - "public/monster-master-rpg-*.js"
      - "src/browser/monster-master-rpg-*.test.ts"
      - "src/browser/monster-master-rpg-model.test.ts"
      - "src/rpg/**"
      - "src/auth/hmac-proxy-request-authenticator.ts"
      - "src/auth/request-authenticator.ts"
      - "src/cloudflare/rpg-edge-*.ts"
      - "src/cloudflare/runtime-contracts.ts"
      - "src/cloudflare/worker.ts"
      - "src/server/http-server.ts"
      - "src/server/durable-rpg-http-server.ts"
      - "src/server/durable-rpg-http-server.test.ts"
      - "src/server/durable-rpg-process-config.ts"
      - "src/server/durable-rpg-process-config.test.ts"
      - "src/server/durable-rpg-service-lifecycle.ts"
      - "src/server/durable-rpg-service-lifecycle.test.ts"
      - "src/server/durable-rpg-service-lifecycle-wait.test.ts"
      - "src/server/run-durable-rpg-service.ts"
      - "src/server/rpg-systemd-deployment.test.ts"
      - "src/server/rpg-http-server.test.ts"
      - "src/server/rpg-live-protocol-v2-http.test.ts"
      - "src/server/rpg-choice-outcome-http.test.ts"
      - "src/server/rpg-choice-outcome-authority.test.ts"
      - "src/server/rpg-choice-consequence-authority.test.ts"
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rpg-node-contract-check-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || github.event.label.name == 'canonical-validation'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.number == 124
        && github.event.comment.body == '/run-rpg-node-contract-check'
      )
    name: Validate RPG fixtures and Node HTTP boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAMEFRAME_ENABLE_RPG_V1_COMPATIBILITY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ (github.event_name == 'issue_comment' || github.event_name == 'schedule') && 'agent/rpg-encounter-battle-loop' || github.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture tested commit
        run: echo "TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical RPG entrypoints and player-shell syntax
        run: >-
          node --experimental-strip-types --check src/server/run-durable-rpg-service.ts
          && node --experimental-strip-types --check src/server/http-server.ts
          && node --experimental-strip-types --check src/rpg/in-memory-rpg-encounter-match-coordinator.ts
          && node --check public/monster-master-rpg-model.js
          && node --check public/monster-master-rpg-app.js
          && node --check public/monster-master-rpg-return.js

      - name: Validate canonical fixtures and Node HTTP behavior
        run: >-
          node --experimental-strip-types --test
          src/browser/monster-master-rpg-model.test.ts
          src/browser/monster-master-rpg-choice-model.test.ts
          src/browser/monster-master-rpg-encounter-model.test.ts
          src/cloudflare/rpg-edge-proxy.test.ts
          src/rpg/rpg-shared-fixtures.test.ts
          src/rpg/rpg-dual-revision-contract.test.ts
          src/rpg/rpg-choice-outcome-fixture.test.ts
          src/rpg/runtime-command-outbox.test.ts
          src/rpg/runtime-command-delivery-worker.test.ts
          src/rpg/sqlite-rpg-campaign-store.test.ts
          src/rpg/sqlite-rpg-command-acceptance.test.ts
          src/rpg/sqlite-rpg-runtime-linkage.test.ts
          src/rpg/sqlite-rpg-encounter-store.test.ts
          src/rpg/durable-rpg-campaign-service.test.ts
          src/rpg/in-memory-rpg-encounter-match-coordinator.test.ts
          src/rpg/structured-choice-flow.test.ts
          src/server/durable-rpg-http-server.test.ts
          src/server/durable-rpg-process-config.test.ts
          src/server/durable-rpg-service-lifecycle.test.ts
          src/server/durable-rpg-service-lifecycle-wait.test.ts
          src/server/rpg-systemd-deployment.test.ts
          src/server/rpg-http-server.test.ts
          src/server/rpg-live-protocol-v2-http.test.ts
          src/server/rpg-choice-outcome-http.test.ts
          src/server/rpg-choice-outcome-authority.test.ts
          src/server/rpg-choice-consequence-authority.test.ts

      - name: Report PR 124 validation result
        if: always() && (github.event_name == 'issue_comment' || github.event_name == 'schedule')
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          const body = [
            "## RPG Node Contract Check",
            "",
            `- Tested commit: \`${process.env.TESTED_COMMIT}\``,
            `- Status: **${process.env.VALIDATION_STATUS}**`,
            `- Workflow run: ${process.env.RUN_URL}`,
          ].join("\n");
          const response = await fetch(
            `${process.env.API_URL}/repos/${process.env.REPOSITORY}/issues/124/comments`,
            {
              method: "POST",
              headers: {
                accept: "application/vnd.github+json",
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                "content-type": "application/json",
                "x-github-api-version": "2022-11-28",
              },
              body: JSON.stringify({ body }),
            },
          );
          if (!response.ok) {
            throw new Error(`Unable to publish validation result: ${response.status}`);
          }
          NODE

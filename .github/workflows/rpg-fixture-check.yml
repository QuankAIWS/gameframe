name: RPG Node Contract Check
run-name: RPG Node Contract Check · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    types: [opened, labeled, reopened, synchronize, ready_for_review]
    paths:
      - ".github/workflows/rpg-fixture-check.yml"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "wrangler.jsonc"
      - "deploy/systemd/**"
      - "planning/fixtures/rpg/**"
      - "planning/rpg-gameframe-interface-contract.md"
      - "planning/rpg-player-shell.md"
      - "planning/rpg-signed-edge-authentication.md"
      - "planning/rpg-single-vm-deployment.md"
      - "public/game-hub.js"
      - "public/gameframe-auth.js"
      - "public/gameframe-nav.js"
      - "public/monster-master-pixi-bridge.js"
      - "public/monster-master-rpg.html"
      - "public/monster-master-rpg.css"
      - "public/monster-master-rpg-*.css"
      - "public/monster-master-rpg-*.js"
      - "src/browser/monster-master-rpg-*.test.ts"
      - "src/browser/monster-master-rpg-model.test.ts"
      - "src/platform/sqlite-match-store.ts"
      - "src/platform/sqlite-match-store.test.ts"
      - "src/rpg/**"
      - "src/auth/hmac-proxy-request-authenticator.ts"
      - "src/auth/request-authenticator.ts"
      - "src/cloudflare/rpg-edge-*.ts"
      - "src/cloudflare/rpg-match-edge-*.ts"
      - "src/cloudflare/rpg-realtime-edge-*.ts"
      - "src/cloudflare/runtime-contracts.ts"
      - "src/cloudflare/worker.ts"
      - "src/server/http-server.ts"
      - "src/server/durable-rpg-http-server.ts"
      - "src/server/durable-rpg-http-server.test.ts"
      - "src/server/durable-rpg-exploration-http.test.ts"
      - "src/server/durable-rpg-exploration-talk.test.ts"
      - "src/server/durable-rpg-realtime-hub.ts"
      - "src/server/durable-rpg-realtime*.test.ts"
      - "src/server/durable-rpg-encounter-match-http.test.ts"
      - "src/server/durable-rpg-configured-terminal-http.test.ts"
      - "src/server/durable-rpg-process-config.ts"
      - "src/server/durable-rpg-process-config.test.ts"
      - "src/server/durable-rpg-service-lifecycle.ts"
      - "src/server/durable-rpg-service-lifecycle.test.ts"
      - "src/server/durable-rpg-service-lifecycle-wait.test.ts"
      - "src/server/run-durable-rpg-service.ts"
      - "src/server/rpg-systemd-deployment.test.ts"
      - "src/server/rpg-http-server.test.ts"
      - "src/server/rpg-encounter-match-http.test.ts"
      - "src/server/rpg-live-protocol-v2-http.test.ts"
      - "src/server/rpg-choice-outcome-http.test.ts"
      - "src/server/rpg-choice-outcome-authority.test.ts"
      - "src/server/rpg-choice-consequence-authority.test.ts"
      - "test/browser/monster-master-rpg-control.spec.mjs"
      - "test/browser/monster-master-rpg-world.spec.mjs"
      - "test/browser/monster-master-rpg-talk.spec.mjs"
      - "test/browser/monster-master-rpg-talk-target-switch.spec.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-node-contract-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.action == 'ready_for_review'
      || github.event.label.name == 'canonical-validation'
      || contains(github.event.pull_request.labels.*.name, 'canonical-validation')
    name: Validate RPG fixtures and Node HTTP/realtime boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GAMEFRAME_ENABLE_RPG_V1_COMPATIBILITY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical RPG entrypoints and player-shell syntax
        run: >-
          node --experimental-strip-types --check src/server/run-durable-rpg-service.ts
          && node --experimental-strip-types --check src/server/http-server.ts
          && node --experimental-strip-types --check src/server/durable-rpg-http-server.ts
          && node --experimental-strip-types --check src/server/durable-rpg-realtime-hub.ts
          && node --experimental-strip-types --check src/rpg/rpg-exploration-contract.ts
          && node --experimental-strip-types --check src/rpg/rpg-exploration-materializer.ts
          && node --experimental-strip-types --check src/rpg/rpg-exploration-movement-service.ts
          && node --experimental-strip-types --check src/rpg/rpg-exploration-interaction-service.ts
          && node --experimental-strip-types --check src/rpg/sqlite-rpg-exploration-position-store.ts
          && node --experimental-strip-types --check src/rpg/sqlite-rpg-command-acceptance.ts
          && node --experimental-strip-types --check src/rpg/runtime-exploration-transport.ts
          && node --experimental-strip-types --check src/rpg/in-memory-rpg-encounter-match-coordinator.ts
          && node --experimental-strip-types --check src/rpg/monster-master-rpg-encounter-materializer.ts
          && node --experimental-strip-types --check src/rpg/sqlite-rpg-encounter-match-binding-store.ts
          && node --experimental-strip-types --check src/rpg/sqlite-rpg-encounter-match-coordinator.ts
          && node --experimental-strip-types --check src/platform/sqlite-match-store.ts
          && node --experimental-strip-types --check src/cloudflare/rpg-match-edge-proxy.ts
          && node --experimental-strip-types --check src/cloudflare/rpg-realtime-edge-proxy.ts
          && node --check public/gameframe-auth.js
          && node --check public/monster-master-pixi-bridge.js
          && node --check public/monster-master-rpg-model.js
          && node --check public/monster-master-rpg-app.js
          && node --check public/monster-master-rpg-world.js
          && node --check public/monster-master-rpg-talk.js
          && node --check public/monster-master-rpg-return.js

      - name: Validate canonical fixtures and Node HTTP/realtime behavior
        run: >-
          node --experimental-strip-types --test
          src/browser/monster-master-rpg-model.test.ts
          src/browser/monster-master-rpg-choice-model.test.ts
          src/browser/monster-master-rpg-encounter-model.test.ts
          src/cloudflare/rpg-edge-proxy.test.ts
          src/cloudflare/rpg-edge-worker-match-routing.test.ts
          src/cloudflare/rpg-match-edge-proxy.test.ts
          src/cloudflare/rpg-realtime-edge-proxy.test.ts
          src/platform/sqlite-match-store.test.ts
          src/rpg/monster-master-rpg-encounter-materializer.test.ts
          src/rpg/rpg-exploration-contract.test.ts
          src/rpg/rpg-exploration-materializer.test.ts
          src/rpg/rpg-exploration-movement-service.test.ts
          src/rpg/rpg-exploration-interaction-service.test.ts
          src/rpg/runtime-exploration-transport.test.ts
          src/rpg/rpg-shared-fixtures.test.ts
          src/rpg/rpg-dual-revision-contract.test.ts
          src/rpg/rpg-choice-outcome-fixture.test.ts
          src/rpg/runtime-command-outbox.test.ts
          src/rpg/runtime-command-delivery-worker.test.ts
          src/rpg/sqlite-rpg-campaign-store.test.ts
          src/rpg/sqlite-rpg-command-acceptance.test.ts
          src/rpg/sqlite-rpg-command-acceptance-travel.test.ts
          src/rpg/durable-rpg-travel.test.ts
          src/rpg/sqlite-rpg-runtime-linkage.test.ts
          src/rpg/sqlite-rpg-encounter-store.test.ts
          src/rpg/durable-rpg-campaign-service.test.ts
          src/rpg/in-memory-rpg-encounter-match-coordinator.test.ts
          src/rpg/structured-choice-flow.test.ts
          src/server/durable-rpg-http-server.test.ts
          src/server/durable-rpg-exploration-http.test.ts
          src/server/durable-rpg-exploration-talk.test.ts
          src/server/durable-rpg-exploration-realtime.test.ts
          src/server/durable-rpg-realtime.test.ts
          src/server/durable-rpg-realtime-hmac.test.ts
          src/server/durable-rpg-encounter-match-http.test.ts
          src/server/durable-rpg-configured-terminal-http.test.ts
          src/server/durable-rpg-process-config.test.ts
          src/server/durable-rpg-service-lifecycle.test.ts
          src/server/durable-rpg-service-lifecycle-wait.test.ts
          src/server/rpg-systemd-deployment.test.ts
          src/server/rpg-http-server.test.ts
          src/server/rpg-encounter-match-http.test.ts
          src/server/rpg-live-protocol-v2-http.test.ts
          src/server/rpg-choice-outcome-http.test.ts
          src/server/rpg-choice-outcome-authority.test.ts
          src/server/rpg-choice-consequence-authority.test.ts

  browser-talk-journey:
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.action == 'ready_for_review'
      || github.event.label.name == 'canonical-validation'
      || contains(github.event.pull_request.labels.*.name, 'canonical-validation')
    name: Verify focused RPG browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run focused RPG player journeys
        run: >-
          npx playwright test
          test/browser/monster-master-rpg-control.spec.mjs
          test/browser/monster-master-rpg-world.spec.mjs
          test/browser/monster-master-rpg-talk.spec.mjs
          test/browser/monster-master-rpg-talk-target-switch.spec.mjs
          --config playwright.config.mjs

      - name: Preserve RPG browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rpg-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: warn

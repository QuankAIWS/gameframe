name: RPG Shared Fixture Check
run-name: RPG Shared Fixture Check · ${{ github.sha }}

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rpg-fixture-check.yml"
      - "planning/fixtures/rpg/**"
      - "planning/rpg-gameframe-interface-contract.md"
      - "src/rpg/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rpg-fixture-check.yml"
      - "planning/fixtures/rpg/**"
      - "planning/rpg-gameframe-interface-contract.md"
      - "src/rpg/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rpg-shared-fixture-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate canonical RPG fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate canonical fixture manifest and cases
        run: node --experimental-strip-types --test src/rpg/rpg-shared-fixtures.test.ts

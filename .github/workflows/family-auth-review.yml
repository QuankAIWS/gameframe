name: Family Auth Review

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/family-auth-review.yml"
      - "public/family-*.html"
      - "public/family-*.css"
      - "public/family-*.js"
      - "src/cloudflare/family-auth-*.ts"
      - "src/cloudflare/http-utils.ts"
      - "src/cloudflare/http-utils.test.ts"
      - "test/browser/family-admin.spec.mjs"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: family-auth-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  family-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Family auth browser syntax
        run: |
          node --check public/family-sign-in.js
          node --check public/family-admin-link.js
          node --check public/family-admin.js

      - name: Family auth edge and storage contracts
        run: |
          node --experimental-strip-types --test \
            src/cloudflare/family-auth-object-runtime.test.ts \
            src/cloudflare/family-auth-edge.test.ts \
            src/cloudflare/http-utils.test.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Family admin browser journey
        run: npx playwright test test/browser/family-admin.spec.mjs --config playwright.config.mjs

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: family-auth-browser-diagnostics-${{ github.run_id }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

name: Materialize Arena Mend Fixture
on:
  push:
    branches: [agent/monster-master-arena-roster-selection]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/monster-master-arena-roster-selection
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply fixture fix
        run: node .github/patch-arena-mend-fixture.mjs
      - name: Verify focused Mend browser path syntax
        run: node --check test/browser/monster-master.spec.mjs
      - name: Commit clean fixture fix
        run: |
          rm .github/patch-arena-mend-fixture.mjs
          rm .github/workflows/materialize-arena-mend-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Make Arena Mend browser setup deterministic"
          git push origin HEAD:agent/monster-master-arena-roster-selection

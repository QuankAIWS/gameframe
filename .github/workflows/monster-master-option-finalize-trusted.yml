name: Monster Master Option Finalize Trusted

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-option-finalize-trusted.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out option repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/monster-master-option-hit-testing
          fetch-depth: 0

      - name: Reconcile current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Complete stable body-level option interaction
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(before)) throw new Error(`Expected source missing from ${path}`);
            writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            "public/monster-master-app.js",
            `let lastActiveUnitId = null;
let viewport = {`,
            `let lastActiveUnitId = null;
let optionsRenderSignature = null;
let viewport = {`,
          );

          replaceOnce(
            "public/monster-master-app.js",
            `function renderOptions() {
  options.replaceChildren();`,
            `function renderOptions() {
  const signature = [
    current?.matchId ?? "",
    current?.revision ?? "",
    requestPending ? "busy" : "ready",
    activePlayerId() ?? "",
    actionMode ?? "",
    selectedUnitId ?? "",
  ].join(":");
  if (optionsRenderSignature === signature) return;
  optionsRenderSignature = signature;
  options.replaceChildren();`,
          );

          replaceOnce(
            "public/monster-master-correction.js",
            `  new MutationObserver(scheduleOptionLayerPosition).observe(options, {
    childList: true,
    subtree: true,
    attributes: true,
  });`,
            `  new MutationObserver(scheduleOptionLayerPosition).observe(options, {
    childList: true,
    subtree: true,
    attributes: true,
    attributeFilter: ["hidden"],
  });`,
          );

          const cssPath = "public/monster-master-correction.css";
          let css = readFileSync(cssPath, "utf8");
          if (!css.includes('#monster-master-options[data-option-layer="true"]')) {
            css += `

body:not(.monster-master-match-active) #monster-master-options[data-option-layer="true"] {
  display: none !important;
}

#monster-master-options[data-option-layer="true"] {
  box-sizing: border-box;
  position: fixed !important;
  z-index: 2147483000;
  top: auto !important;
  right: auto !important;
  left: var(--monster-option-layer-left, 12px) !important;
  bottom: var(--monster-option-layer-bottom, 12px) !important;
  width: var(--monster-option-layer-width, calc(100vw - 24px)) !important;
  max-width: calc(100vw - 24px);
  max-height: min(34vh, 250px);
  display: flex !important;
  flex-wrap: wrap;
  align-content: flex-start;
  gap: 8px;
  margin: 0 !important;
  padding: 10px;
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid rgba(99, 164, 232, .52);
  border-radius: 14px;
  background: rgba(5, 11, 22, .97);
  box-shadow: 0 18px 55px rgba(0, 0, 0, .58), inset 0 1px rgba(255, 255, 255, .04);
  pointer-events: auto !important;
  transform: none !important;
}

#monster-master-options[data-option-layer="true"]:empty,
#monster-master-options[data-option-layer="true"][hidden] {
  display: none !important;
}

#monster-master-options[data-option-layer="true"] button {
  position: relative;
  z-index: 1;
  flex: 1 1 150px;
  min-width: 0;
  pointer-events: auto !important;
}

@media (max-width: 640px) {
  #monster-master-options[data-option-layer="true"] {
    max-height: min(30vh, 220px);
    padding: 8px;
  }

  #monster-master-options[data-option-layer="true"] button {
    flex-basis: 120px;
  }
}
`;
          }
          writeFileSync(cssPath, css);

          const testPath = "test/browser/monster-master-option-hit-testing.spec.mjs";
          let testSource = readFileSync(testPath, "utf8");
          const functionStart = testSource.indexOf("async function assertOptionsOwnTheirHitArea(page) {");
          const loopStart = testSource.indexOf("\nfor (const candidate of [", functionStart);
          if (functionStart < 0 || loopStart < 0) throw new Error("Option hit-test helper boundary missing");
          const replacement = `async function assertOptionsOwnTheirHitArea(page) {
  const options = page.locator('#monster-master-options[data-option-layer="true"]');
  await expect(options).toBeVisible();
  const buttons = options.locator("button");
  await expect.poll(() => buttons.count()).toBeGreaterThan(0);

  const layerState = await options.evaluate((node) => {
    const rect = node.getBoundingClientRect();
    const style = getComputedStyle(node);
    const canvas = document.querySelector("#monster-master-pixi-canvas");
    const canvasZ = Number.parseInt(canvas ? getComputedStyle(canvas).zIndex : "0", 10) || 0;
    const layerZ = Number.parseInt(style.zIndex, 10) || 0;
    return {
      parentIsBody: node.parentElement === document.body,
      position: style.position,
      insideViewport: rect.left >= 0
        && rect.top >= 0
        && rect.right <= window.innerWidth
        && rect.bottom <= window.innerHeight,
      aboveCanvas: layerZ > canvasZ,
    };
  });
  expect(layerState).toEqual({
    parentIsBody: true,
    position: "fixed",
    insideViewport: true,
    aboveCanvas: true,
  });

  const visibleGeometry = await buttons.evaluateAll((nodes) => {
    const layer = document.querySelector('#monster-master-options[data-option-layer="true"]');
    const layerRect = layer.getBoundingClientRect();
    return nodes.map((button) => {
      const rect = button.getBoundingClientRect();
      const left = Math.max(rect.left, layerRect.left, 0);
      const right = Math.min(rect.right, layerRect.right, window.innerWidth);
      const top = Math.max(rect.top, layerRect.top, 0);
      const bottom = Math.min(rect.bottom, layerRect.bottom, window.innerHeight);
      if (right - left <= 1 || bottom - top <= 1) return { visible: false };
      const x = (left + right) / 2;
      const y = (top + bottom) / 2;
      const hit = document.elementFromPoint(x, y);
      return {
        visible: true,
        ownsHit: hit === button || button.contains(hit),
        hitTag: hit?.tagName ?? null,
        hitId: hit?.id ?? null,
        hitClass: hit?.className ?? null,
      };
    }).filter((result) => result.visible);
  });
  expect(visibleGeometry.length).toBeGreaterThan(0);
  for (const result of visibleGeometry) {
    expect(result.ownsHit, JSON.stringify(result)).toBe(true);
  }

  await page.evaluate(() => {
    window.__monsterMasterStableOption = document.querySelector("#monster-master-options button");
  });
  await page.waitForTimeout(1_500);
  await expect.poll(() => page.evaluate(() => (
    window.__monsterMasterStableOption?.isConnected
    && window.__monsterMasterStableOption === document.querySelector("#monster-master-options button")
  ))).toBe(true);

  const lastButton = buttons.last();
  await lastButton.scrollIntoViewIfNeeded();
  await expect(lastButton).toBeVisible();
  const lastOwnsHit = await lastButton.evaluate((button) => {
    const rect = button.getBoundingClientRect();
    const hit = document.elementFromPoint(rect.left + rect.width / 2, rect.top + rect.height / 2);
    return hit === button || button.contains(hit);
  });
  expect(lastOwnsHit).toBe(true);

  const firstButton = buttons.first();
  await firstButton.scrollIntoViewIfNeeded();
  await firstButton.click();
  await expect(page.locator("#monster-master-revision")).toHaveText("Revision 7");
}
`;
          testSource = testSource.slice(0, functionStart) + replacement + testSource.slice(loopStart);
          writeFileSync(testPath, testSource);

          const contractPath = "src/browser/monster-master-art-contract.test.ts";
          let contract = readFileSync(contractPath, "utf8");
          contract = contract.replace(
            '  const correction = await read("public/monster-master-correction.js");\n',
            '  const correction = await read("public/monster-master-correction.js");\n  const correctionStyles = await read("public/monster-master-correction.css");\n',
          );
          contract = contract.replace(
            '  const canonicalControls = await read("test/browser/monster-master-controls.spec.mjs");\n',
            '  const canonicalControls = await read("test/browser/monster-master-controls.spec.mjs");\n  const optionHitTesting = await read("test/browser/monster-master-option-hit-testing.spec.mjs");\n',
          );
          contract = contract.replace(
            '  assert.doesNotMatch(correction, /CanvasRenderingContext2D\\.prototype/);\n',
            `  assert.doesNotMatch(correction, /CanvasRenderingContext2D\\.prototype/);
  assert.match(correction, /options\\.dataset\\.optionLayer = "true"/);
  assert.match(correction, /document\\.body\\.append\\(options\\)/);
  assert.match(correction, /attributeFilter: \\["hidden"\\]/);
  assert.doesNotMatch(correction, /containPixiCanvas/);
  assert.match(correctionStyles, /#monster-master-options\\[data-option-layer="true"\\]/);
  assert.match(correctionStyles, /position: fixed !important/);
  assert.match(correctionStyles, /--monster-option-layer-left/);
  assert.match(monsterApp, /let optionsRenderSignature = null/);
  assert.match(monsterApp, /if \\(optionsRenderSignature === signature\\) return/);
  assert.match(optionHitTesting, /document\\.elementFromPoint/);
  assert.match(optionHitTesting, /__monsterMasterStableOption/);
`,
          );
          contract = contract.replace(
            '  assert.match(packageJson.scripts["check:browser"], /src\\/browser\\/monster-master-terrain-geometry\\.js/);\n',
            '  assert.match(packageJson.scripts["check:browser"], /src\\/browser\\/monster-master-terrain-geometry\\.js/);\n  assert.match(packageJson.scripts["test:browser:required"], /monster-master-option-hit-testing\\.spec\\.mjs/);\n',
          );
          writeFileSync(contractPath, contract);

          const workflowPath = ".github/workflows/player-ui-review.yml";
          let workflow = readFileSync(workflowPath, "utf8");
          if (!workflow.includes('      - "test/browser/monster-master-option-hit-testing.spec.mjs"')) {
            workflow = workflow.replace(
              '      - "test/browser/monster-master-controls.spec.mjs"\n',
              '      - "test/browser/monster-master-controls.spec.mjs"\n      - "test/browser/monster-master-option-hit-testing.spec.mjs"\n',
            );
          }
          writeFileSync(workflowPath, workflow);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded required validation
        id: validation
        continue-on-error: true
        run: npm run validate

      - name: Commit completed option interaction
        if: steps.validation.outcome == 'success'
        run: |
          rm -f .github/workflows/monster-master-option-finalize-trusted.yml
          git add -A
          git commit -m "fix: finalize Monster Master option hit testing"
          git push origin HEAD:agent/monster-master-option-hit-testing

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            gh pr comment 78 --body "Final option interaction repair passed bounded required validation and committed the branch. Trusted run: ${{ github.run_id }}."
          else
            gh pr comment 78 --body "Final option interaction repair failed bounded required validation. Trusted run: ${{ github.run_id }}."
          fi

      - name: Fail unsuccessful validation
        if: steps.validation.outcome != 'success'
        run: exit 1

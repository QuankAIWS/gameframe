name: Monster Master Option Hit Trusted

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/monster-master-option-hit-trusted.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out option repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/monster-master-option-hit-testing
          fetch-depth: 0

      - name: Reconcile current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Complete stable option-layer implementation
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");

          function replaceOnce(path, before, after) {
            const source = readFileSync(path, "utf8");
            if (!source.includes(before)) throw new Error(`Expected source missing from ${path}`);
            writeFileSync(path, source.replace(before, after));
          }

          replaceOnce(
            "public/monster-master-app.js",
            "let lastActiveUnitId = null;\nlet viewport = {",
            "let lastActiveUnitId = null;\nlet optionsRenderSignature = null;\nlet viewport = {",
          );

          replaceOnce(
            "public/monster-master-app.js",
            `function renderOptions() {
            options.replaceChildren();`,
            `function renderOptions() {
            const signature = [
              current?.matchId ?? "",
              current?.revision ?? "",
              requestPending ? "busy" : "ready",
              activePlayerId() ?? "",
              actionMode ?? "",
              selectedUnitId ?? "",
            ].join(":");
            if (optionsRenderSignature === signature) return;
            optionsRenderSignature = signature;
            options.replaceChildren();`,
          );

          const cssPath = "public/monster-master-correction.css";
          let css = readFileSync(cssPath, "utf8");
          css = css.replace(`
          body.monster-master-match-active .monster-master-command-deck {
            position: absolute;
            z-index: 30;
            isolation: isolate;
            pointer-events: auto !important;
          }

          .monster-master-command-deck .monster-master-options,
          .monster-master-command-deck .monster-master-options button {
            position: relative;
            z-index: 1;
            pointer-events: auto;
          }
`, "\n");
          if (!css.includes("data-option-layer")) {
            css += `

#monster-master-options[data-option-layer="true"] {
  position: fixed !important;
  z-index: 2147483000;
  left: var(--monster-option-layer-left, 12px);
  bottom: var(--monster-option-layer-bottom, 12px);
  width: var(--monster-option-layer-width, calc(100vw - 24px));
  max-width: calc(100vw - 24px);
  max-height: min(34vh, 250px);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px;
  overflow: auto;
  border: 1px solid rgba(99, 164, 232, .52);
  border-radius: 14px;
  background: rgba(5, 11, 22, .97);
  box-shadow: 0 18px 55px rgba(0, 0, 0, .58), inset 0 1px rgba(255, 255, 255, .04);
  pointer-events: auto !important;
  transform: none !important;
}

#monster-master-options[data-option-layer="true"]:empty {
  display: none !important;
}

#monster-master-options[data-option-layer="true"] button {
  position: relative;
  z-index: 1;
  flex: 1 1 150px;
  min-width: 0;
  pointer-events: auto !important;
}

@media (max-width: 640px) {
  #monster-master-options[data-option-layer="true"] {
    max-height: min(30vh, 220px);
    padding: 8px;
  }

  #monster-master-options[data-option-layer="true"] button {
    flex-basis: 120px;
  }
}
`;
          }
          writeFileSync(cssPath, css);

          const workflowPath = ".github/workflows/player-ui-review.yml";
          let workflow = readFileSync(workflowPath, "utf8");
          if (!workflow.includes('      - "test/browser/monster-master-option-hit-testing.spec.mjs"')) {
            workflow = workflow.replace(
              '      - "test/browser/monster-master-controls.spec.mjs"\n',
              '      - "test/browser/monster-master-controls.spec.mjs"\n      - "test/browser/monster-master-option-hit-testing.spec.mjs"\n',
            );
          }
          writeFileSync(workflowPath, workflow);
          NODE

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run bounded required validation
        id: validation
        continue-on-error: true
        run: npm run validate

      - name: Commit completed option repair
        if: steps.validation.outcome == 'success'
        run: |
          rm -f .github/workflows/monster-master-option-hit-trusted.yml
          git add -A
          git commit -m "fix: make Monster Master target options clickable"
          git push origin HEAD:agent/monster-master-option-hit-testing

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            gh pr comment 78 --body "Option interaction repair passed bounded required validation and committed the branch. Trusted run: ${{ github.run_id }}."
          else
            gh pr comment 78 --body "Option interaction repair failed bounded required validation. Trusted run: ${{ github.run_id }}."
          fi

      - name: Fail unsuccessful validation
        if: steps.validation.outcome != 'success'
        run: exit 1

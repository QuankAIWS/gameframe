name: Build Monster Master Pixi Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - agent/monster-master-pixi-renderer
    paths:
      - "src/browser/monster-master-pixi-entry.js"
      - "public/monster-master-app.js"
      - "public/auth-launcher.js"
      - "public/monster-master-pixi-bridge.js"
      - "scripts/build-monster-master-pixi.mjs"
      - "scripts/refine-monster-master-pixi.mjs"
      - "scripts/refine-monster-master-input.mjs"
      - "scripts/refine-monster-master-state-channel.mjs"
      - "scripts/refine-monster-master-pixi-camera.mjs"
      - ".github/workflows/build-monster-master-pixi.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/browser/monster-master-pixi-entry.js"
      - "public/monster-master-app.js"
      - "public/auth-launcher.js"
      - "public/monster-master-pixi-bridge.js"
      - "scripts/build-monster-master-pixi.mjs"
      - "scripts/refine-monster-master-pixi.mjs"
      - "scripts/refine-monster-master-input.mjs"
      - "scripts/refine-monster-master-state-channel.mjs"
      - "scripts/refine-monster-master-pixi-camera.mjs"
      - ".github/workflows/build-monster-master-pixi.yml"

permissions:
  contents: write

concurrency:
  group: monster-master-pixi-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve pinned Pixi dependency
        run: npm install pixi.js@8.19.0 --save-exact

      - name: Apply one-time renderer refinements
        if: github.event_name == 'push'
        run: |
          if grep -q 'viewSignature: ""' src/browser/monster-master-pixi-entry.js; then
            echo "Pixi runtime refinements are already applied."
          else
            node scripts/refine-monster-master-pixi.mjs
          fi
          if grep -q 'function handleBattlefieldCoordinate' public/monster-master-app.js; then
            echo "Direct battlefield coordinate input is already applied."
          else
            node scripts/refine-monster-master-input.mjs
          fi
          if grep -q 'window.gameFrameMonsterController = Object.freeze' public/monster-master-app.js; then
            echo "Direct controller-to-Pixi state channel is already applied."
          else
            node scripts/refine-monster-master-state-channel.mjs
          fi
          if grep -q 'const width = Math.max(1, state.frame.clientWidth)' src/browser/monster-master-pixi-entry.js; then
            echo "Logical camera dimensions are already applied."
          else
            node scripts/refine-monster-master-pixi-camera.mjs
          fi

      - name: Build browser bundle
        run: node scripts/build-monster-master-pixi.mjs

      - name: Validate generated runtime
        run: |
          node --check public/monster-master-pixi-bundle.js
          node --check public/monster-master-app.js
          node --check public/auth-launcher.js
          node --check public/monster-master-pixi-bridge.js

      - name: Commit generated renderer files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/browser/monster-master-pixi-entry.js public/monster-master-pixi-bundle.js public/monster-master-app.js public/auth-launcher.js public/monster-master-pixi-bridge.js
          if ! git diff --cached --quiet; then
            git commit -m "Normalize Monster Master Pixi camera space"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload reproducible renderer files
        uses: actions/upload-artifact@v4
        with:
          name: monster-master-pixi-bootstrap-${{ github.run_id }}
          path: |
            package.json
            package-lock.json
            src/browser/monster-master-pixi-entry.js
            public/monster-master-pixi-bundle.js
            public/monster-master-app.js
            public/auth-launcher.js
            public/monster-master-pixi-bridge.js
          if-no-files-found: error
          retention-days: 3

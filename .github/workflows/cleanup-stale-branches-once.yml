name: Cleanup stale branches once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-stale-branches-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'agent/materialize-mm-rock-direct-assets'
            'agent/mm-rock-direct-tree-probe'
            'agent/mm-rock-fresh-transfer'
            'agent/mm-rock-issue-finalizer-temp'
            'agent/mm-rock-package-diagnostics'
            'agent/pr124-validator-no-cancel'
          )

          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GH_REPO}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              gh api --method DELETE -H 'Accept: application/vnd.github+json' \
                "/repos/${GH_REPO}/git/refs/heads/${encoded}"
            else
              echo "Already absent: ${branch}"
            fi
          done

      - name: Verify obsolete refs are absent
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          branches=(
            'agent/materialize-mm-rock-direct-assets'
            'agent/mm-rock-direct-tree-probe'
            'agent/mm-rock-fresh-transfer'
            'agent/mm-rock-issue-finalizer-temp'
            'agent/mm-rock-package-diagnostics'
            'agent/pr124-validator-no-cancel'
          )

          failed=0
          for branch in "${branches[@]}"; do
            encoded="${branch//\//%2F}"
            if gh api -H 'Accept: application/vnd.github+json' \
              "/repos/${GH_REPO}/git/ref/heads/${encoded}" >/dev/null 2>&1; then
              echo "Still present: ${branch}" >&2
              failed=1
            else
              echo "Confirmed absent: ${branch}"
            fi
          done

          exit "$failed"

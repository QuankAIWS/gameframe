name: Purge Retired GameFrame Opponent Identity
run-name: Purge retired GameFrame opponent identity · PR ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  purge:
    if: >-
      github.event.pull_request.number == 124
      && contains(github.event.pull_request.labels.*.name, 'purge-retired-gameframe-id')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out target feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/rpg-encounter-battle-loop
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.16.0
          cache: npm

      - name: Purge remaining retired opponent literals
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const roots = ['src', 'public', 'test', 'scripts', '.github'];
          const extensions = new Set([
            '.ts', '.tsx', '.js', '.mjs', '.cjs', '.json', '.jsonc', '.html', '.css',
            '.md', '.txt', '.yml', '.yaml',
          ]);

          function filesUnder(root) {
            if (!fs.existsSync(root)) return [];
            const files = [];
            for (const entry of fs.readdirSync(root, { withFileTypes: true })) {
              const target = path.join(root, entry.name);
              if (entry.isDirectory()) files.push(...filesUnder(target));
              else if (entry.isFile() && extensions.has(path.extname(entry.name).toLowerCase())) files.push(target);
            }
            return files;
          }

          for (const file of roots.flatMap(filesUnder)) {
            const before = fs.readFileSync(file, 'utf8');
            const after = before
              .replaceAll('"theo"', '"gameframe-bot"')
              .replaceAll("'theo'", "'gameframe-bot'")
              .replace(/\bTHEO(?=[A-Z0-9_])/g, 'GAMEFRAME_BOT')
              .replace(/\bTheo(?=[A-Z0-9_])/g, 'GameFrameBot')
              .replace(/\btheo(?=[A-Z0-9_])/g, 'bot')
              .replace(/\bTheo\b/g, 'GameFrameBot')
              .replace(/\btheo\b/g, 'bot');
            if (after !== before) fs.writeFileSync(file, after);
          }
          NODE

          if grep -RniE '\b[Tt]heo\b|\bTHEO[A-Z0-9_]|\bTheo[A-Z0-9_]|\btheo[A-Z0-9_]' \
            src public test scripts .github \
            --include='*.ts' --include='*.tsx' --include='*.js' --include='*.mjs' \
            --include='*.cjs' --include='*.json' --include='*.jsonc' --include='*.html' \
            --include='*.css' --include='*.md' --include='*.txt' --include='*.yml' --include='*.yaml'; then
            echo 'Retired opponent identity still present.' >&2
            exit 1
          fi

      - name: Validate identity cleanup and Node suite
        run: |
          npm ci --no-audit --no-fund
          node --experimental-strip-types src/scripts/self-check.ts
          npm test

      - name: Commit cleanup to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public test scripts .github
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No cleanup changes remained.'
            exit 0
          fi
          git commit -m 'Purge retired built-in opponent identity'
          git push origin HEAD:agent/rpg-encounter-battle-loop
